<!doctype html>
<html lang="de" data-theme="dark" data-accent="iris">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0C0E14" />
    <title>Lingo-Engine X</title>
    <!-- U2 Start-Bild: Darstellung vor dem ersten Zeichnen wie die App (src/app/settings.ts): gespeicherte Wahl, „auto“ = System, sonst Dunkel. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var s = window.localStorage;
          var t = s.getItem('lx:theme');
          var a = s.getItem('lx:accent');
          if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          if (t !== 'dark' && t !== 'dim' && t !== 'light') t = 'dark';
          if (a !== 'amber') a = 'iris';
          d.setAttribute('data-theme', t);
          d.setAttribute('data-accent', a);
          d.lang = s.getItem('lx:lang') === 'en' ? 'en' : 'de';
          d.style.colorScheme = t === 'light' ? 'light' : 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#F5F7FA' : t === 'dim' ? '#282A2F' : '#0C0E14');
        } catch (e) {
          d.setAttribute('data-accent', 'iris');
        }
        // Datum im Start-Bild: im Kopf vor dem Stylesheet, sonst wartet es im Mehr-Datei-Build auf das CSS (perf.spec U2).
        try {
          var en = window.localStorage.getItem('lx:lang') === 'en';
          var n = new Date();
          if (n.getHours() < 4) n.setDate(n.getDate() - 1);
          n.setHours(12, 0, 0, 0);
          var text = new Intl.DateTimeFormat(en ? 'en-US' : 'de-DE', { weekday: 'long', day: 'numeric', month: 'long' }).format(n);
          var mo = new MutationObserver(function () {
            var el = document.getElementById('lx-boot-date');
            if (!el) return;
            el.textContent = text;
            mo.disconnect();
          });
          mo.observe(d, { childList: true, subtree: true });
          // H3: nie endlos beobachten – spätestens nach dem Einlesen des Dokuments (oder 10 s) ist Schluss.
          var stop = function () {
            var el = document.getElementById('lx-boot-date');
            if (el && el.textContent !== text) el.textContent = text;
            mo.disconnect();
          };
          document.addEventListener('DOMContentLoaded', stop, { once: true });
          setTimeout(function () {
            mo.disconnect();
          }, 10000);
        } catch (e) {
          /* ohne Datum: die App setzt es gleich selbst */
        }
      })();
    </script>
    <script type="module" crossorigin src="./index-KfiHNtS7.js"></script>
    <link rel="stylesheet" crossorigin href="./style-CG4RGBww.css">
  </head>
  <body>
    <!-- U2 Start-Bild (#lx-boot): reines HTML/CSS, sofort sichtbar. Gleicher Aufbau und gleiche Klassen wie der Ladezustand der App
         (src/features/system/HomeSkeleton.tsx + Rahmen in src/app/shell/Shell.tsx, Breiten-Stufen in src/styles/parts/shell.css): React ersetzt es beim ersten Zeichnen ohne Sprung.
         Wer hier etwas ändert, ändert HomeSkeleton mit (Test: tests/e2e/perf.spec.ts „Start-Bild“). -->
    <div id="root"><div id="lx-boot" class="lx-frame" data-nav="" aria-busy="true"><nav class="lx-nav dz-tabbar" aria-hidden="true"></nav><div class="lx-dmain"><div class="lx-stage"><div class="flex min-h-11 items-center justify-end gap-3 pt-3"><span class="inline-flex size-11"></span></div><main class="lx-main-nav flex-1"><div class="mx-auto flex w-full max-w-[46rem] flex-col gap-5 pt-4 pb-10 sm:pt-8 lg:max-w-[70rem]"><header class="flex flex-col gap-1"><div class="flex min-h-11 items-center justify-between gap-3"><h1 class="min-w-0 text-2xl leading-tight font-bold tracking-[-0.02em] sm:text-3xl" style="text-wrap: nowrap" id="lx-boot-date">&nbsp;</h1></div></header><div class="lg:grid lg:grid-cols-12 lg:items-start lg:gap-8"><div class="flex flex-col gap-5 lg:col-span-7"><div class="lx-card lx-today-card flex flex-col gap-4 p-[1.125rem] sm:p-6" aria-hidden="true"><div class="flex items-center gap-3.5"><div class="lx-skeleton size-28 flex-none rounded-full"></div><div class="flex min-w-0 flex-1 flex-col gap-2"><div class="lx-skeleton h-5 w-4/5"></div><div class="lx-skeleton h-3 w-24"></div></div></div><div class="flex flex-col gap-1.5"><div class="lx-skeleton h-[3.25rem] rounded-[0.875rem]"></div><div class="lx-skeleton h-[3.25rem] rounded-[0.875rem]"></div><div class="lx-skeleton h-[3.25rem] rounded-[0.875rem]"></div></div><div class="lx-skeleton mt-auto min-h-14 rounded-full"></div><div class="min-h-4"></div></div></div></div></div></main></div><aside class="lx-ctx" aria-hidden="true"></aside></div></div></div>
  </body>
</html>
