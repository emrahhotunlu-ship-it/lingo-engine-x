    <meta charset="utf-8" />

    <title>Lingo-Engine X</title>
    <!-- U2 Start-Bild: Darstellung vor dem ersten Zeichnen wie die App (src/app/settings.ts): gespeicherte Wahl, „auto“ = System, sonst Dunkel. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var s = window.localStorage;
          var t = s.getItem('lx:theme');
          var a = s.getItem('lx:accent');
          if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          if (t !== 'dark' && t !== 'dim' && t !== 'light') t = 'dark';
          if (a !== 'amber') a = 'iris';
          d.setAttribute('data-theme', t);
          d.setAttribute('data-accent', a);
          d.lang = s.getItem('lx:lang') === 'en' ? 'en' : 'de';
          d.style.colorScheme = t === 'light' ? 'light' : 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#F5F3EE' : t === 'dim' ? '#282A2F' : '#141614');
        } catch (e) {
          d.setAttribute('data-accent', 'iris');
        }
        // Start-Bild in der gewählten Sprache (Navigation wie TabBar.tsx, Kopf „Heute“/„Today“ wie TodayHead.tsx; D2 V-HEUTE: der Kopf zeigt
        // „Heute“ statt des Datums). Im Kopf vor dem Stylesheet, sonst wartet es im Mehr-Datei-Build auf das CSS (perf.spec U2).
        try {
          var en = window.localStorage.getItem('lx:lang') === 'en';
          var labels = function () {
            if (!en) return;
            var ls = document.querySelectorAll('#lx-boot [data-en]');
            for (var i = 0; i < ls.length; i++) ls[i].textContent = ls[i].getAttribute('data-en');
          };
          var mo = new MutationObserver(function () {
            if (!document.getElementById('lx-boot-date')) return;
            labels();
            mo.disconnect();
          });
          if (en) mo.observe(d, { childList: true, subtree: true });
          // H3: nie endlos beobachten – spätestens nach dem Einlesen des Dokuments (oder 10 s) ist Schluss.
          document.addEventListener(
            'DOMContentLoaded',
            function () {
              labels();
              mo.disconnect();
            },
            { once: true },
          );
          setTimeout(function () {
            mo.disconnect();
          }, 10000);
        } catch (e) {
          /* ohne Übersetzung: die App setzt die Texte gleich selbst */
        }
      })();
    </script>
