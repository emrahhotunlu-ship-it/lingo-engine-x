html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
  font-feature-settings: 'cv11', 'ss01';
}
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--act-text); outline-offset: 2px; border-radius: 10px; }
.disp { font-variation-settings: 'opsz' 32; letter-spacing: -0.022em; }
.num { font-variant-numeric: tabular-nums; }
.en { font-feature-settings: 'cv11', 'ss01', 'calt'; }
em, .em { font-style: normal; font-weight: 600; color: var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.w { background: var(--ch-words); } .dot.g { background: var(--ch-gram); } .dot.l { background: var(--ch-listen); } .dot.s { background: var(--ch-speak); }
svg { display: block; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.xs { width: 14px; height: 14px; stroke-width: 2.2; }

/* ---------- Grundgerüst der Vorschau ---------- */
#lx { height: 100%; position: relative; display: flex; background: var(--bg); }
.view { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }
.view.centered { display: flex; align-items: center; justify-content: center; background: var(--bg-deep); }
.view.scrollx { overflow: auto; background: var(--bg-deep); }

/* Handy */
.ph { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); isolation: isolate; }
.ph.framed { width: 390px; height: 844px; flex: none; border-radius: 44px; box-shadow: 0 0 0 1px var(--line-2), 0 40px 90px -40px oklch(0 0 0 / 0.7); transform-origin: center center; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
.gx { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { width: 0; }

/* Reiterseiten */
.phead { display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding-top: 8px; }
.phead h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r); color: var(--fg-2); margin-right: -10px; }
.iconbtn:active { background: var(--surface-2); }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--bg); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-left, 0px)) 8px max(8px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 2px; min-height: 50px; color: var(--fg-3); font-size: 11px; font-weight: 550; letter-spacing: 0.005em; }
.tab .ic { width: 25px; height: 25px; }
.tab.on { color: var(--act-text); }
.tab.on .ic { stroke-width: 2; }

/* Knöpfe */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: var(--r); font-size: 17px; font-weight: 600; letter-spacing: -0.005em; transition: transform 140ms var(--ease-soft), background 140ms, opacity 140ms; }
.btn:active { transform: scale(0.98); }
.btn.pri { background: var(--act); color: var(--act-fg); }
.btn.sec { background: var(--surface-2); color: var(--fg); }
.btn.ghost { color: var(--fg-2); min-height: 44px; font-size: 15px; font-weight: 550; }
.btn.full { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn .k { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: 0.6; line-height: 16px; }
.link { color: var(--act-text); font-weight: 550; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center; }

/* Heute */
.daycard { background: var(--surface); border-radius: var(--r); padding: 22px 20px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 18px; }
.ringwrap { display: flex; justify-content: center; position: relative; }
.ring { width: 188px; height: 188px; cursor: pointer; border-radius: 50%; }
.ring .seg { fill: none; stroke-width: 11; stroke-linecap: round; }
.ring .trk { stroke: var(--surface-3); }
.ring .on { stroke: var(--act); }
.ring .part { stroke: var(--act); opacity: 0.45; }
.ringc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.ringc b { font-size: 46px; line-height: 50px; font-weight: 650; }
.ringc span { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.dtopic { display: flex; flex-direction: column; gap: 6px; text-align: center; }
.dtopic .t { font-size: 22px; line-height: 28px; font-weight: 650; text-wrap: balance; }
.dtopic .sub { font-size: 15px; color: var(--fg-2); line-height: 20px; }
.dtopic .sub em { color: var(--fg); font-weight: 600; font-style: normal; }
.nextl { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: var(--fg-2); }
.week { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 18px 2px 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); font-weight: 550; width: 32px; }
.wd i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); }
.wd.done i { background: var(--act-soft); color: var(--act-text); }
.wd.today i { box-shadow: 0 0 0 2px var(--act) inset; background: transparent; }
.wd.rest i { background: transparent; box-shadow: 0 0 0 1.5px var(--line-2) inset; }
.streak { display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; color: var(--fg-3); font-weight: 550; gap: 2px; margin-left: 4px; }
.streak b { font-size: 20px; line-height: 22px; color: var(--fg); font-weight: 650; }
.more-div { display: flex; align-items: center; gap: 12px; margin: 22px 0 6px; color: var(--fg-3); font-size: 13px; font-weight: 550; }
.more-div::before, .more-div::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
.row { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
.row .ri { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); flex: none; }
.row .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .rt b { font-weight: 600; font-size: 16px; }
.row .rt span { font-size: 13px; color: var(--fg-2); }
.row .chev { color: var(--fg-3); }
.statelist { display: flex; flex-direction: column; gap: 0; margin: -4px 0; }
.st { display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid var(--line); font-size: 16px; }
.st:last-child { border-bottom: 0; }
.st .sm { margin-left: auto; font-size: 13px; color: var(--fg-2); }
.st .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.st.done .mk { background: var(--act-soft); color: var(--act-text); }
.st.run .mk { box-shadow: 0 0 0 2px var(--act) inset; }
.st.run .mk::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--act); }
.st.open .mk { box-shadow: 0 0 0 1.5px var(--line-2) inset; }
.st.done .nm { color: var(--fg-2); }
.donebadge { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--act-text); }

/* Skelett */
.sk { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; border-radius: 10px; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* Übungsrahmen */
.ex-top { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-top: 6px; flex: none; }
.ex-top .iconbtn { margin: 0 -6px; }
.bar { flex: 1; display: flex; gap: 4px; height: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--surface-3); position: relative; overflow: hidden; }
.bar i.d { background: var(--act); }
.bar i b { position: absolute; inset: 0 auto 0 0; background: var(--act); border-radius: 3px; transition: width 380ms var(--ease-soft); }
.bar i.pulse::after { content: ''; position: absolute; inset: -6px; background: radial-gradient(closest-side, oklch(1 0 0 / 0.9), transparent); animation: pulse 300ms ease-out both; }
@keyframes pulse { from { opacity: 0; transform: scaleX(0.3); } 40% { opacity: 1; } to { opacity: 0; transform: scaleX(1.4); } }
.checkrow { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; color: var(--fg-2); width: 100%; }
.checkrow .cks { display: flex; gap: 6px; letter-spacing: 0; }
.ck { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--line-2) inset; color: var(--ok); }
.ck.y { background: color-mix(in oklch, var(--ok) 22%, transparent); box-shadow: none; }
.checklist { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 10px; }
.checklist .ci { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px; }
.ex-body { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; transition: padding 220ms var(--ease-soft); }
.ex-body::-webkit-scrollbar { width: 0; }
.blockline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-2); font-weight: 550; min-height: 24px; margin-top: 8px; }
.blockline.flash { animation: flash 900ms var(--ease-soft) both; }
@keyframes flash { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.instr { display: flex; align-items: flex-start; gap: 12px; margin-top: 10px; }
.instr p { margin: 0; flex: 1; font-size: 17px; line-height: 24px; font-weight: 550; }
.why { flex: none; min-height: 32px; padding: 0 10px; border-radius: 10px; background: var(--surface-2); color: var(--fg-2); font-size: 13px; font-weight: 600; margin-top: -4px; }
.stagec { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 18px 0 24px; min-height: 0; transition: all 220ms var(--ease-soft); }
.with-band .stagec { justify-content: flex-start; padding-top: 22px; }
.prompt { font-size: 32px; line-height: 38px; font-weight: 650; text-wrap: balance; }
.hintline { font-size: 15px; color: var(--fg-2); line-height: 21px; }
.sent { font-size: 22px; line-height: 34px; font-weight: 500; text-wrap: pretty; }
.sent .w { border-radius: 6px; cursor: pointer; }
.sent .w:active, .sent .w.sel { background: var(--act-soft); }
.gap { display: inline-flex; align-items: flex-end; min-width: 120px; position: relative; vertical-align: baseline; border-bottom: 2px solid var(--act); padding: 0 4px; min-height: 36px; }
.gap.big { font-size: 30px; line-height: 40px; min-width: 200px; font-weight: 600; }
.gap .lt { display: inline-block; animation: pop 220ms var(--ease-spring) both; white-space: pre; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.6); } to { opacity: 1; transform: none; } }
.gap .caret { width: 2px; height: 0.95em; background: var(--act-text); align-self: center; animation: blink 1s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.gap input { position: absolute; inset: 0; width: 100%; opacity: 0; border: 0; background: transparent; font-size: 16px; }
.gap.st-ok { border-color: var(--ok); color: var(--ok); }
.gap.st-near { border-color: var(--near); color: var(--near); }
.gap.st-bad { border-color: var(--bad); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.gap.st-idk { border-color: var(--fg-3); color: var(--fg-3); }
.gap.shake { animation: shake 250ms ease-in-out; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.ex-foot { flex: none; display: flex; gap: 8px; padding-top: 10px; padding-bottom: 14px; background: var(--bg); }
.ex-foot .btn.pri { flex: 1; }
.ex-foot.abovekb { padding-bottom: 8px; }
.pattern { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--fg-2); }
.pattern span { padding: 5px 9px; border-radius: 8px; background: var(--surface-2); font-weight: 550; }
.pattern span.on { background: var(--act-soft); color: var(--act-text); }
.pagedots { display: flex; justify-content: center; gap: 6px; padding: 2px 0 10px; }
.pagedots i { width: 6px; height: 6px; border-radius: 3px; background: var(--surface-3); transition: width 220ms; }
.pagedots i.on { width: 18px; background: var(--fg-2); }

/* Rückmeldeband */
.band { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 45%; overflow: hidden; background: var(--surface); border-radius: 22px 22px 0 0; padding-top: 18px; padding-bottom: 14px; box-shadow: 0 -1px 0 var(--line), 0 -24px 48px -28px oklch(0 0 0 / 0.5); display: flex; flex-direction: column; gap: 10px; animation: bandUp 220ms var(--ease-spring) both; }
.band.s-ok { background: color-mix(in oklch, var(--surface) 90%, var(--ok)); }
.band.s-near { background: color-mix(in oklch, var(--surface) 90%, var(--near)); }
.band.s-bad { background: color-mix(in oklch, var(--surface) 91%, var(--bad)); }
@keyframes bandUp { from { transform: translateY(100%); } to { transform: none; } }
.verdict { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 650; line-height: 26px; }
.verdict .vi { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.s-ok .verdict { color: var(--ok); } .s-ok .vi { background: color-mix(in oklch, var(--ok) 20%, transparent); }
.s-near .verdict { color: var(--near); } .s-near .vi { background: color-mix(in oklch, var(--near) 20%, transparent); }
.s-bad .verdict { color: var(--bad); } .s-bad .vi { background: color-mix(in oklch, var(--bad) 20%, transparent); }
.s-idk .verdict { color: var(--fg); } .s-idk .vi { box-shadow: 0 0 0 2px var(--fg-3) inset; }
.cmp { font-size: 17px; line-height: 23px; color: var(--fg); }
.cmp .you { color: var(--fg-2); }
.cmp s { text-decoration-thickness: 1.5px; text-decoration-color: var(--bad); }
.cmp b { font-weight: 650; }
.whyl { font-size: 15px; line-height: 21px; color: var(--fg-2); margin: 0; }
.bandbtns { display: flex; gap: 8px; }
.bandbtns .btn { flex: 1; }
.hintband { position: absolute; left: 0; right: 0; z-index: 4; display: flex; align-items: center; gap: 10px; min-height: 48px; background: var(--surface-2); font-size: 16px; font-weight: 550; animation: bandUp 220ms var(--ease-spring) both; border-radius: 16px 16px 0 0; }
.hintband .ic { color: var(--act-text); }

/* Blätter */
.scrim { position: absolute; inset: 0; z-index: 8; background: var(--scrim); animation: fade 260ms ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 85%; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: sheetUp 500ms var(--ease-spring) both; box-shadow: 0 -30px 60px -30px oklch(0 0 0 / 0.6); }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 8px auto 4px; flex: none; }
.sheet h2 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 650; }
.sheet .sb { flex: 1; overflow-y: auto; padding-top: 8px; padding-bottom: 12px; }
.sheet .sf { flex: none; padding-top: 10px; padding-bottom: 14px; border-top: 1px solid var(--line); }
.menu { position: absolute; top: 56px; right: 12px; z-index: 9; width: 260px; background: var(--surface-2); border-radius: var(--r); box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 6px; animation: menuIn 220ms var(--ease-spring) both; transform-origin: top right; }
@keyframes menuIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 0 12px; border-radius: 10px; font-size: 16px; text-align: left; }
.menu button:active { background: var(--surface-3); }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 8px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg2 button { min-height: 38px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--fg-2); }
.seg2 button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px oklch(0 0 0 / 0.2); }

/* Inhaltsbausteine */
.card { background: var(--surface); border-radius: var(--r); padding: 18px; }
.lbl { font-size: 13px; color: var(--fg-2); font-weight: 550; }
.h2 { font-size: 20px; line-height: 26px; font-weight: 650; margin: 0; }
.p { font-size: 16px; line-height: 23px; margin: 0; color: var(--fg); }
.p2 { font-size: 15px; line-height: 21px; margin: 0; color: var(--fg-2); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.s6 { gap: 6px; } .stack.s8 { gap: 8px; } .stack.s16 { gap: 16px; } .stack.s24 { gap: 24px; }
.hr { height: 1px; background: var(--line); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 19px; }
.tbl th { text-align: left; font-weight: 600; color: var(--fg-2); font-size: 13px; padding: 0 8px 8px 0; vertical-align: bottom; }
.tbl td { padding: 9px 8px 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tbl td:first-child { color: var(--fg-2); width: 22%; }
.tbl .hl { color: var(--act-text); font-weight: 600; }
.contrast { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; font-size: 16px; line-height: 22px; }
.contrast .k { font-size: 12px; font-weight: 650; color: var(--fg-3); width: 22px; }
.contrast .no { color: var(--fg-3); text-decoration: line-through; text-decoration-color: var(--bad); }
.ex-list { display: flex; flex-direction: column; }
.ex-list div { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.ex-list div:first-child { border-top: 0; }
.ex-list b { font-weight: 550; font-size: 16px; }
.ex-list span { font-size: 13px; color: var(--fg-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--fg-2); }
.stagepill { font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 7px; background: var(--surface-2); color: var(--fg-2); }
.stagepill.s5 { background: var(--act-soft); color: var(--act-text); }
.choice { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: var(--r); background: var(--surface); font-size: 16px; font-weight: 550; text-align: left; width: 100%; box-shadow: 0 0 0 1px var(--line) inset; }
.choice .n { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; color: var(--fg-2); flex: none; }
.choice.sel { box-shadow: 0 0 0 2px var(--act) inset; }
.choice.ok { box-shadow: 0 0 0 2px var(--ok) inset; }
.quote { font-size: 17px; line-height: 24px; padding-left: 14px; border-left: 2px solid var(--line-2); }

/* Tastatur (angedeutet) */
.kbd { flex: none; background: var(--kb); padding: 6px 3px 0; position: relative; z-index: 3; }
.kbd .sug { display: grid; grid-template-columns: repeat(3, 1fr); height: 40px; align-items: center; text-align: center; color: var(--kb-fg); font-size: 15px; opacity: 0.85; }
.kbd .sug span + span { border-left: 1px solid oklch(0.5 0 0 / 0.35); }
.kbd .kr { display: flex; justify-content: center; gap: 6px; margin: 0 0 11px; }
.kbd .kk { height: 42px; flex: 1; max-width: 34px; border-radius: 6px; background: var(--kb-key); color: var(--kb-fg); display: grid; place-items: center; font-size: 22px; font-weight: 400; box-shadow: 0 1px 0 oklch(0 0 0 / 0.35); }
.kbd .kk.f { background: var(--kb-key-2); font-size: 15px; max-width: 44px; }
.kbd .kk.sp { max-width: none; flex: 5; font-size: 15px; }
.kbd .kk.go { max-width: 88px; flex: 2.2; font-size: 15px; background: var(--act); color: var(--act-fg); }
.kbd .kb-bot { display: flex; justify-content: space-between; align-items: center; padding: 2px 22px 12px; color: var(--kb-fg); height: 48px; }
.kbd .kb-bot .ic { width: 26px; height: 26px; opacity: 0.85; }
.kbd .tag { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 11px; color: var(--kb-fg); opacity: 0.5; }
.kbd .mic { position: relative; }
.kbd .mic.hl::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--act); animation: ring 1.6s ease-out infinite; }
.kbd .globe.hl::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--act); }
.kbd .globe { position: relative; }
@keyframes ring { 0% { opacity: 1; transform: scale(0.9); } 100% { opacity: 0; transform: scale(1.35); } }
.arrowtip { position: absolute; right: 64px; bottom: 12px; z-index: 4; display: flex; align-items: center; gap: 8px; background: var(--act); color: var(--act-fg); padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; animation: bob 1.4s ease-in-out infinite; }
.arrowtip::after { content: ''; position: absolute; right: -7px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right: 0; border-left-color: var(--act); }
@keyframes bob { 50% { transform: translateX(-4px); } }

/* Antwortfelder */
.field { width: 100%; min-height: 108px; resize: none; border: 0; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line-2) inset; padding: 14px 16px; font-size: 17px; line-height: 24px; color: var(--fg); position: relative; }
.field:focus { outline: none; box-shadow: 0 0 0 2px var(--act) inset; }
.fieldwrap { position: relative; }
.timeline { position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 1px; background: var(--surface-3); overflow: hidden; }
.timeline i { position: absolute; inset: 0 auto 0 0; width: 62%; background: var(--fg-3); }
.pinned { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--fg-2); min-height: 40px; padding-block: 4px 6px; }
.pinned b { color: var(--fg); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.persona { display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 650; font-size: 15px; color: var(--fg-2); flex: none; }
.bubble { max-width: 86%; padding: 12px 14px; border-radius: 18px; font-size: 16px; line-height: 22px; background: var(--surface); }
.bubble.me { align-self: flex-end; background: var(--act-soft); }
.bubble.them { align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.me { border-bottom-right-radius: 6px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--surface-2); font-size: 15px; line-height: 21px; }
.notice .ic { color: var(--fg-2); margin-top: 1px; }

/* Hören */
.player { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 8px 0; }
.playbtn { width: 128px; height: 128px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow), 0 0 0 1px var(--line) inset; display: grid; place-items: center; color: var(--fg); position: relative; }
.playbtn .ic { width: 44px; height: 44px; stroke-width: 1.6; }
.playbtn svg.prog { position: absolute; inset: -6px; width: 140px; height: 140px; transform: rotate(-90deg); }
.wave { display: flex; align-items: center; gap: 3px; height: 40px; }
.wave i { width: 3px; border-radius: 2px; background: var(--fg-3); }
.wave i.p { background: var(--fg); }

function ringSvg(blocks, done, partial, opts) {
  opts = opts || {};
  const T = blocks.reduce((a, b) => a + b.m, 0);
  const cx = 100, cy = 100, r = 86, gap = 8;
  let a = -90, out = '';
  const pt = deg => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  blocks.forEach((b, i) => {
    const span = b.m / T * 360;
    const a0 = a + gap / 2, a1 = a + span - gap / 2;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const large = a1 - a0 > 180 ? 1 : 0;
    const d = 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
    out += '<path class="seg trk" d="' + d + '"/>';
    if (i < done) out += '<path class="seg on" pathLength="100" style="--d:' + (i * 90) + 'ms" d="' + d + '"/>';
    else if (i === done && partial > 0) out += '<path class="seg on" pathLength="100" stroke-dasharray="' + (partial * 100).toFixed(1) + ' 100" style="--d:' + (i * 90) + 'ms" d="' + d + '"/>';
    if (b.mission) {
      const [mx, my] = pt(a + span / 2);
      out += '<g transform="translate(' + (mx - 13).toFixed(1) + ' ' + (my - 13).toFixed(1) + ')"><circle cx="13" cy="13" r="13" fill="var(--surface)"/><circle cx="13" cy="13" r="11.5" fill="none" stroke="' + (i < done ? 'var(--act)' : 'var(--surface-3)') + '" stroke-width="1.5"/>' +
        '<svg x="6" y="6" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + IC.flag + '</svg></g>';
    }
    a += span;
  });
  return '<svg class="ring' + (opts.draw ? ' draw' : '') + '" id="ring" viewBox="0 0 200 200" role="button" tabindex="0" aria-label="' + esc(L('Blöcke von heute zeigen', 'Show today’s blocks')) + '">' + out + '</svg>';
}

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');

}

    }

/* ---------- Lücken-Tippen (Buchstaben-Animation) ---------- */
function editDist(a, b) {
  const m = a.length, n = b.length, d = [];
  for (let i = 0; i <= m; i++) { d[i] = [i]; }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function judge(typed, right, alts) {
  const t = (typed || '').trim().toLowerCase();
  if (!t) return 'idk';
  if (t === right || (alts || []).indexOf(t) >= 0) return 'ok';
  if (editDist(t, right) <= (right.length > 5 ? 2 : 1)) return 'typo';
  return 'wrong';
}
function wireGap(id, onEnter) {
  const inp = document.getElementById(id + '-in');
  const gap = document.getElementById(id);
  if (!inp || !gap) return;
  const lts = gap.querySelector('.lts');
  let prev = inp.value;
  inp.addEventListener('input', () => {
    clearTimeout(autoTimer);
    const val = inp.value;
    S.typed = val;
    if (val.startsWith(prev) && val.length === prev.length + 1) {
      const s = document.createElement('span'); s.className = 'lt'; s.innerHTML = val.slice(-1) === ' ' ? '&nbsp;' : esc(val.slice(-1)); lts.appendChild(s);
    } else {
      lts.innerHTML = val.split('').map(c => '<span class="lt" style="animation:none">' + (c === ' ' ? '&nbsp;' : esc(c)) + '</span>').join('');
    }
    prev = val;
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); onEnter(); } });
  gap.addEventListener('click', () => { clearTimeout(autoTimer); inp.focus(); });
}
function autoType(id, text, after) {
  const gap = document.getElementById(id), inp = document.getElementById(id + '-in');
  if (!gap) return;
  const lts = gap.querySelector('.lts');
  let i = 0;
  const step = () => {
    if (i >= text.length) { if (after) after(); return; }
    const c = text[i++];
    const s = document.createElement('span'); s.className = 'lt'; s.innerHTML = c === ' ' ? '&nbsp;' : esc(c); lts.appendChild(s);
    if (inp) inp.value = text.slice(0, i);
    S.typed = text.slice(0, i);
    autoTimer = setTimeout(step, S.motion === 'off' ? 0 : 110);
  };
  autoTimer = setTimeout(step, S.motion === 'off' ? 0 : 450);
}

}

function gramTask(o) {

const DESK = {};
DESK.bp = function (w) {
  if (w < 1024) return { cls: 'bp-narrow rail', fs: 16 };
  if (w < 1280) return { cls: 'bp-mid rail', fs: 16 };
  if (w < 1920) return { cls: '', fs: 16 };
  if (w < 2400) return { cls: 'bp-xl', fs: 18 };
  return { cls: 'bp-xl', fs: 20 };
};
DESK.frame = function (def, v, W, H) {
  if (def.full) return def.render(v, { W, H });
  if (W >= 1024) {
    return '<div class="view">' + DESK.shell(def, v, W, H, '') + '</div>';
  }
  const s = (W - 32) / 1440;
  return '<div class="view scrollx"><div class="landhint">' + ic('rotate', 'sm') + '<span>' + L('Laptop-Ansicht, verkleinert auf 1440 × 900. Für mehr Platz das Handy quer halten.', 'Laptop view, scaled from 1440 × 900. Turn the phone sideways for more room.') + '</span></div>' +
    '<div style="width:' + Math.floor(1440 * s) + 'px;height:' + Math.floor(900 * s) + 'px;margin:0 16px 24px;overflow:hidden" class="probeframe">' +
    '<div style="width:1440px;height:900px;transform:scale(' + s.toFixed(4) + ');transform-origin:top left">' + DESK.shell(def, v, 1440, 900, '') + '</div></div></div>';
};
DESK.shell = function (def, v, w, h, idp) {
  const bp = DESK.bp(w);
  const rail = S.ui.rail != null ? S.ui.rail : bp.cls.indexOf('rail') >= 0;
  const cls = bp.cls.replace('rail', '').trim() + (rail ? ' rail' : '');
  const out = def.render(v, { w, h, idp: idp || '' });
  return '<div class="desk ' + cls + '" id="' + (idp || '') + 'desk" style="width:' + w + 'px;height:' + h + 'px;font-size:' + bp.fs + 'px">' +
    DESK.side(def.nav, idp || '', rail) +
    '<div class="dmain"><div class="stage">' + out.stage + '</div>' + (out.ctx ? '<aside class="ctx" aria-label="' + esc(L('Kontext', 'Context')) + '">' + out.ctx + '</aside>' : '') + '</div>' +

        '<div class="notice" style="font-size:.92em">' + ic('laptop', 'sm') + '<span>' + L('Am Laptop tippst du deine Antworten. Gesprochen wird am Handy.', 'On the laptop you type your answers. Speaking happens on the phone.') + '</span></div>' +
        (phone ? '<div class="notice" style="font-size:.92em">' + ic('phone', 'sm') + '<span>' + L('Öffne Lingo am Handy. Die Mission steht dort an derselben Stelle bereit, hier geht es danach weiter.', 'Open Lingo on your phone. The mission waits at the same point there and continues here afterwards.') + '</span></div>' : '') +
        '<div class="fieldwrap"><textarea class="field en" id="d-answer" rows="3" style="min-height:5.5em" placeholder="' + esc(L('Deine Antwort …', 'Your answer …')) + '"></textarea><div class="timeline"><i style="width:22%"></i></div></div></div>' +
        dKeys('<button class="btn sec" id="d-phone" data-act="phone">' + ic('phone', 'sm') + L('Am Handy sprechen', 'Speak on the phone') + '</button><button class="btn pri" id="d-send" data-go="l6-report">' + L('Senden', 'Send') + kb('⌘⏎') + '</button>'),
      ctx: missionCtx([1, 0, 0])
    };
  },
  acts: { phone() { S.ui.phone = !S.ui.phone; render(); } }
});

/* ---------- L7 Claude in der Kontextspalte ---------- */
reg('l7', {
  code: 'L7', name: 'Claude in der Kontextspalte', kind: 'desk', nav: 'claude',
  variants: [['claude', 'Claude'], ['translate', 'Übersetzer']],
  render(v) {
    const seg = '<div class="seg2" role="tablist"><button id="d-ask-claude" data-go="l7-claude" class="' + (v === 'claude' ? 'on' : '') + '" role="tab">Claude</button><button id="d-ask-trans" data-go="l7-translate" class="' + (v === 'translate' ? 'on' : '') + '" role="tab">' + L('Übersetzen', 'Translate') + '</button></div>';
    const head = '<div style="display:flex;align-items:center;gap:.6em"><div style="flex:1">' + seg + '</div><button class="iconbtn" id="d-ctx-close" data-go="l3-band" aria-label="' + esc(L('Schließen', 'Close')) + '">' + ic('close', 'sm') + '</button></div>';
    let body;
    if (v === 'claude') {
      body = '<span class="chip" style="align-self:flex-start">' + ic('info', 'xs') + L('Aufgabe + deine Antwort sind dabei', 'Task + your answer included') + '</span>' +
        '<div class="bubble me" style="max-width:92%">' + L('Warum nicht <span class="en">have sent</span>? Es ist doch gerade erst passiert.', 'Why not have sent? It only just happened.') + '</div>' +
        '<div class="p" style="line-height:1.55">' + L('Weil <em class="en">yesterday</em> im Satz steht. Ein vergangener Zeitpunkt macht die Handlung abgeschlossen, egal wie kurz sie her ist. Ohne Zeitangabe wäre <em class="en">We’ve sent the revised quote</em> richtig. Ist es eben erst passiert: <em class="en">We’ve just sent it</em> (US auch <em class="en">We just sent it</em>).', 'Because yesterday is in the sentence. A past time makes the action finished, however recent. Without a time word, We’ve sent the revised quote would be right. If it only just happened: We’ve just sent it (US also We just sent it).') + '</div>' +
        '<div style="flex:1"></div><div style="display:flex;gap:.5em"><textarea class="field" id="d-claude-in" rows="1" style="min-height:3em;padding:.7em .9em" placeholder="' + esc(L('Frag Claude …', 'Ask Claude …')) + '"></textarea><button class="btn pri" id="d-claude-send" data-act="noop" aria-label="' + esc(L('Senden', 'Send')) + '" style="width:3.2em;padding:0">' + ic('send', 'sm') + '</button></div>';
    } else {
      body = '<textarea class="field" id="d-trans-in" rows="2" style="min-height:4.5em">Wir haben die Lieferzeit bereits verkürzt.</textarea>' +
        '<div class="card stack s8"><p class="p en" style="font-weight:600;font-size:1.1em;margin:0">We’ve already reduced the lead time.</p><p class="p2 en" style="margin:0">also: We’ve already shortened the lead time. · We’ve already cut the lead time.</p><p class="p2" style="margin:0">' + L('Kein Zeitpunkt, Ergebnis zählt: present perfect.', 'No time named, result matters: present perfect.') + '</p></div>' +
        '<button class="btn sec" id="d-tr-add" data-act="noop" style="align-self:flex-start">' + ic('plus', 'sm') + L('In die Wörter', 'Add to words') + '</button>';
    }
    return { stage: l3Stage('band', true), ctx: head + '<div class="stack s16" style="flex:1;display:flex;flex-direction:column">' + body + '</div>' };
  }
});

/* ---------- L9 Schreibtag ---------- */
const CATS = () => [
  ['mark-good', 'var(--ok)', L('Inhalt und Wirkung', 'Content and impact'), L('Preisnachlass als Ergebnis genannt, klarer nächster Schritt. Das wirkt.', 'Discount stated as a result, clear next step. That works.')],
  ['mark-reg', 'var(--ch-gram)', L('Register', 'Register'), L('<em class="en">is difficult</em> klingt hart. Weicher: <em class="en">would be difficult for us</em>.', '<em>is difficult</em> sounds blunt. Softer: <em>would be difficult for us</em>.')],
  ['mark-str', 'var(--ch-listen)', L('Aufbau', 'Structure'), L('Erst Lieferzeit, dann Preis, dann Termin: gute Reihenfolge. <em class="en">Regarding the price:</em> mit Doppelpunkt wirkt wie eine Stichpunktliste. Im Fließtext leitest du so über: <em class="en">As for the price, …</em>', 'Lead time, then price, then meeting: good order. <em>Regarding the price:</em> with a colon reads like a bullet list. In running text, lead in like this: <em>As for the price, …</em>')],
  ['mark-lang', 'var(--bad)', L('Sprache', 'Language'), L('<s class="en">I have checked … yesterday</s> → <b class="en">I checked … yesterday</b>. Vergangener Zeitpunkt, also past simple. Nach <em class="en">Hi Laura,</em> beginnt die nächste Zeile im Englischen groß: <em class="en">Thanks …</em>', '<s>I have checked … yesterday</s> → <b>I checked … yesterday</b>. Past time, so past simple. After <em>Hi Laura,</em> the next line starts with a capital letter: <em>Thanks …</em>')]
];
reg('l9', {

  render(v) {
    const blocks = dayBlocks('normal');
    if (v === 'end') {
      return {
        stage: dTop(blocks, 4, 1) + '<div class="dscroll stack s16" style="padding-top:1em">' + blockLine('s', L('Schreibtag · deine überarbeitete Fassung', 'Writing day · your revised version')) +
          '<div class="verdict" style="color:var(--ok)"><span class="vi" style="background:color-mix(in oklch, var(--ok) 20%, transparent)">' + ic('check', 'xs') + '</span>' + L('Bereit zum Abschicken', 'Ready to send') + '</div>' +
          '<div class="card mailtext en"><p>Hi Laura,</p><p><b>Thanks</b> for taking the time to talk on Wednesday. I <b>checked</b> the numbers with our logistics team yesterday, and we can offer a lead time of eight weeks instead of ten.</p><p><b>As for the price,</b> we’ve already reduced it by 5 percent in the revised quote. A further discount <b>would be difficult for us</b>, but we could offer a two-year contract with fixed prices.</p><p>Could we have a quick call on Monday to go through the details?</p><p>Best regards,</p></div>' +
          '<p class="p2" style="margin:0">' + L('Zwei Wendungen gehen in deine Wörter: <em class="en">as for the price</em>, <em class="en">would be difficult for us</em>.', 'Two phrases go into your words: <em>as for the price</em>, <em>would be difficult for us</em>.') + '</p></div>' +
          dKeys('<button class="btn sec" id="d-copy" data-act="copy">' + L('Text kopieren', 'Copy text') + '</button><button class="btn pri" id="d-next" data-go="h10-day">' + L('Weiter', 'Continue') + kb('⏎') + '</button>'),
        ctx: ctxBlock(L('Was sich verbessert hat', 'What improved'), '<div class="checklist" style="padding:0">' + [L('Zeitform korrigiert', 'Tense fixed'), L('Großschreibung nach der Anrede', 'Capital after the greeting'), L('Ton weicher', 'Softer tone'), L('Überleitung zum Preis', 'Lead-in to the price')].map(t => '<div class="ci" style="font-size:.92em"><span class="ck y">' + ic('check', 'xs') + '</span>' + t + '</div>').join('') + '</div>')
      };
    }
    return {
      stage: dTop(blocks, 4, 0.55) + '<div class="dscroll stack s16" style="padding-top:1em">' + blockLine('s', L('Schreibtag · Projekt-Update an den Einkauf', 'Writing day · project update to purchasing')) +
        instr(L('Lies die Markierungen, dann überarbeite die Mail.', 'Read the marks, then revise the email.'), 'd-why') +
        '<div class="card mailtext en"><p>Hi Laura,</p><p><span class="mark-lang">thanks</span> for taking the time to talk on Wednesday. <span class="mark-lang">I have checked the numbers with our logistics team yesterday</span>, and we can offer a lead time of eight weeks instead of ten.</p>' +
        '<p><span class="mark-str">Regarding the price:</span> <span class="mark-good">we have already reduced it by 5 percent in the revised quote.</span> A further discount <span class="mark-reg">is difficult</span>, but we could offer a two-year contract with fixed prices.</p>' +
        '<p><span class="mark-good">Could we have a quick call on Monday to go through the details?</span></p><p>Best regards,</p></div></div>' +
        dKeys('<button class="btn sec" id="d-askmail" data-go="l7">' + ic('claude', 'sm') + L('Claude fragen', 'Ask Claude') + '</button><button class="btn pri" id="d-revise" data-go="l9-end">' + L('Überarbeiten', 'Revise') + kb('⏎') + '</button>'),
      ctx: ctxBlock(L('Rückmeldung in vier Bereichen', 'Feedback in four areas'), '<div>' + CATS().map(c => '<div class="cat"><div class="ct"><span class="sw ' + c[0] + '" style="box-shadow:none;background:' + c[1] + '"></span>' + c[2] + '</div><div class="p2" style="font-size:.92em">' + c[3] + '</div></div>').join('') + '</div>')
    };
  },
  acts: { copy() { const t = $('.mailtext'); try { navigator.clipboard.writeText(t ? t.innerText : '').catch(() => {}); } catch (e) { /* Zwischenablage nicht verfügbar: Text bleibt markierbar */ } } }
});

/* ---------- L10 Breitenproben ---------- */
reg('l10', {
  code: 'L10', name: 'Breitenproben', kind: 'desk', full: true,
  variants: [['all', '768 · 1024 · 2560']],
  render(v, o) {
    const W = o.W;
    const avail = Math.max(280, W - 32);
    const probes = [[768, 1024, 'Tablet hochkant'], [1024, 768, 'Tablet quer / kleiner Laptop'], [2560, 1440, 'großer Bildschirm']];
    const l1 = SCREENS.l1;
    return '<div class="view scrollx" style="padding-bottom:32px">' + '<div class="probe" style="padding-top:16px;font-size:14px;max-width:760px">' + L('Dieselbe Heute-Seite in drei Breiten. Unter jeder Probe: Breite der Bühne und Anteil leerer Rand.', 'The same Today page at three widths. Under each probe: stage width and share of empty margin.') + '</div>' +
      probes.map((p, i) => {
        const s = Math.min(1, avail / p[0]);
        const idp = 'pr' + i + '-';
        return '<div style="padding:16px 16px 0"><div class="probe" style="padding:0 0 8px"><b>' + p[0] + ' × ' + p[1] + '</b> · ' + p[2] + ' · <span id="' + idp + 'info">…</span></div>' +
          '<div class="probeframe" style="width:' + Math.floor(p[0] * s) + 'px;height:' + Math.floor(p[1] * s) + 'px"><div style="width:' + p[0] + 'px;height:' + p[1] + 'px;transform:scale(' + s.toFixed(4) + ');transform-origin:top left">' + DESK.shell(l1, 'main', p[0], p[1], idp) + '</div></div></div>';
      }).join('') + '</div>';
  },
  after() {
    [768, 1024, 2560].forEach((w, i) => {
      const idp = 'pr' + i + '-';
      const d = document.getElementById(idp + 'desk'); const info = document.getElementById(idp + 'info');
      if (!d || !info) return;
      const st = d.querySelector('.stage'), side = d.querySelector('.side'), cx = d.querySelector('.ctx');
      const used = side.offsetWidth + st.offsetWidth + (cx && cx.offsetParent ? cx.offsetWidth : 0);
      info.textContent = L('Bühne ', 'Stage ') + st.offsetWidth + ' px · ' + L('leerer Rand ', 'empty margin ') + Math.max(0, Math.round((w - used) / w * 100)) + ' %' + (d.classList.contains('rail') ? L(' · Leiste als Schiene', ' · sidebar as rail') : '') + (cx && !cx.offsetParent ? L(' · Kontextspalte aus', ' · context column hidden') : '');
    });
  }
});

boot();
