html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
  font-feature-settings: 'cv11', 'ss01';
}
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--act-text); outline-offset: 2px; border-radius: 10px; }
.disp { font-variation-settings: 'opsz' 32; letter-spacing: -0.022em; }
.num { font-variant-numeric: tabular-nums; }
.en { font-feature-settings: 'cv11', 'ss01', 'calt'; }
em, .em { font-style: normal; font-weight: 600; color: var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.w { background: var(--ch-words); } .dot.g { background: var(--ch-gram); } .dot.l { background: var(--ch-listen); } .dot.s { background: var(--ch-speak); }
svg { display: block; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.xs { width: 14px; height: 14px; stroke-width: 2.2; }

/* ---------- Grundgerüst der Vorschau ---------- */
#lx { height: 100%; position: relative; display: flex; background: var(--bg); }
.view { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }
.view.centered { display: flex; align-items: center; justify-content: center; background: var(--bg-deep); }
.view.scrollx { overflow: auto; background: var(--bg-deep); }

/* Handy */
.ph { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); isolation: isolate; }
.ph.framed { width: 390px; height: 844px; flex: none; border-radius: 44px; box-shadow: 0 0 0 1px var(--line-2), 0 40px 90px -40px oklch(0 0 0 / 0.7); transform-origin: center center; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
.gx { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { width: 0; }

/* Reiterseiten */
.phead { display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding-top: 8px; }
.phead h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r); color: var(--fg-2); margin-right: -10px; }
.iconbtn:active { background: var(--surface-2); }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--bg); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-left, 0px)) 8px max(8px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 2px; min-height: 50px; color: var(--fg-3); font-size: 11px; font-weight: 550; letter-spacing: 0.005em; }
.tab .ic { width: 25px; height: 25px; }
.tab.on { color: var(--act-text); }
.tab.on .ic { stroke-width: 2; }

/* Knöpfe */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: var(--r); font-size: 17px; font-weight: 600; letter-spacing: -0.005em; transition: transform 140ms var(--ease-soft), background 140ms, opacity 140ms; }
.btn:active { transform: scale(0.98); }
.btn.pri { background: var(--act); color: var(--act-fg); }
.btn.sec { background: var(--surface-2); color: var(--fg); }
.btn.ghost { color: var(--fg-2); min-height: 44px; font-size: 15px; font-weight: 550; }
.btn.full { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn .k { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: 0.6; line-height: 16px; }
.link { color: var(--act-text); font-weight: 550; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center; }

/* Heute */
.daycard { background: var(--surface); border-radius: var(--r); padding: 22px 20px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 18px; }
.ringwrap { display: flex; justify-content: center; position: relative; }
.ring { width: 188px; height: 188px; cursor: pointer; border-radius: 50%; }
.ring .seg { fill: none; stroke-width: 11; stroke-linecap: round; }
.ring .trk { stroke: var(--surface-3); }
.ring .on { stroke: var(--act); }
.ring .part { stroke: var(--act); opacity: 0.45; }
.ringc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.ringc b { font-size: 46px; line-height: 50px; font-weight: 650; }
.ringc span { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.dtopic { display: flex; flex-direction: column; gap: 6px; text-align: center; }
.dtopic .t { font-size: 22px; line-height: 28px; font-weight: 650; text-wrap: balance; }
.dtopic .sub { font-size: 15px; color: var(--fg-2); line-height: 20px; }
.dtopic .sub em { color: var(--fg); font-weight: 600; font-style: normal; }
.nextl { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: var(--fg-2); }
.week { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 18px 2px 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); font-weight: 550; width: 32px; }
.wd i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); }
.wd.done i { background: var(--act-soft); color: var(--act-text); }
.wd.today i { box-shadow: 0 0 0 2px var(--act) inset; background: transparent; }
.wd.rest i { background: transparent; box-shadow: 0 0 0 1.5px var(--line-2) inset; }
.streak { display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; color: var(--fg-3); font-weight: 550; gap: 2px; margin-left: 4px; }
.streak b { font-size: 20px; line-height: 22px; color: var(--fg); font-weight: 650; }
.more-div { display: flex; align-items: center; gap: 12px; margin: 22px 0 6px; color: var(--fg-3); font-size: 13px; font-weight: 550; }
.more-div::before, .more-div::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
.row { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
.row .ri { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); flex: none; }
.row .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .rt b { font-weight: 600; font-size: 16px; }
.row .rt span { font-size: 13px; color: var(--fg-2); }
.row .chev { color: var(--fg-3); }
.statelist { display: flex; flex-direction: column; gap: 0; margin: -4px 0; }
.st { display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid var(--line); font-size: 16px; }
.st:last-child { border-bottom: 0; }
.st .sm { margin-left: auto; font-size: 13px; color: var(--fg-2); }
.st .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.st.done .mk { background: var(--act-soft); color: var(--act-text); }
.st.run .mk { box-shadow: 0 0 0 2px var(--act) inset; }
.st.run .mk::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--act); }
.st.open .mk { box-shadow: 0 0 0 1.5px var(--line-2) inset; }
.st.done .nm { color: var(--fg-2); }
.donebadge { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--act-text); }

/* Skelett */
.sk { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; border-radius: 10px; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* Übungsrahmen */
.ex-top { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-top: 6px; flex: none; }
.ex-top .iconbtn { margin: 0 -6px; }
.bar { flex: 1; display: flex; gap: 4px; height: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--surface-3); position: relative; overflow: hidden; }
.bar i.d { background: var(--act); }
.bar i b { position: absolute; inset: 0 auto 0 0; background: var(--act); border-radius: 3px; transition: width 380ms var(--ease-soft); }
.bar i.pulse::after { content: ''; position: absolute; inset: -6px; background: radial-gradient(closest-side, oklch(1 0 0 / 0.9), transparent); animation: pulse 300ms ease-out both; }
@keyframes pulse { from { opacity: 0; transform: scaleX(0.3); } 40% { opacity: 1; } to { opacity: 0; transform: scaleX(1.4); } }
.checkrow { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; color: var(--fg-2); width: 100%; }
.checkrow .cks { display: flex; gap: 6px; letter-spacing: 0; }
.ck { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--line-2) inset; color: var(--ok); }
.ck.y { background: color-mix(in oklch, var(--ok) 22%, transparent); box-shadow: none; }
.checklist { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 10px; }
.checklist .ci { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px; }
.ex-body { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; transition: padding 220ms var(--ease-soft); }
.ex-body::-webkit-scrollbar { width: 0; }
.blockline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-2); font-weight: 550; min-height: 24px; margin-top: 8px; }
.blockline.flash { animation: flash 900ms var(--ease-soft) both; }
@keyframes flash { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.instr { display: flex; align-items: flex-start; gap: 12px; margin-top: 10px; }
.instr p { margin: 0; flex: 1; font-size: 17px; line-height: 24px; font-weight: 550; }
.why { flex: none; min-height: 32px; padding: 0 10px; border-radius: 10px; background: var(--surface-2); color: var(--fg-2); font-size: 13px; font-weight: 600; margin-top: -4px; }
.stagec { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 18px 0 24px; min-height: 0; transition: all 220ms var(--ease-soft); }
.with-band .stagec { justify-content: flex-start; padding-top: 22px; }
.prompt { font-size: 32px; line-height: 38px; font-weight: 650; text-wrap: balance; }
.hintline { font-size: 15px; color: var(--fg-2); line-height: 21px; }
.sent { font-size: 22px; line-height: 34px; font-weight: 500; text-wrap: pretty; }
.sent .w { border-radius: 6px; cursor: pointer; }
.sent .w:active, .sent .w.sel { background: var(--act-soft); }
.gap { display: inline-flex; align-items: flex-end; min-width: 120px; position: relative; vertical-align: baseline; border-bottom: 2px solid var(--act); padding: 0 4px; min-height: 36px; }
.gap.big { font-size: 30px; line-height: 40px; min-width: 200px; font-weight: 600; }
.gap .lt { display: inline-block; animation: pop 220ms var(--ease-spring) both; white-space: pre; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.6); } to { opacity: 1; transform: none; } }
.gap .caret { width: 2px; height: 0.95em; background: var(--act-text); align-self: center; animation: blink 1s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.gap input { position: absolute; inset: 0; width: 100%; opacity: 0; border: 0; background: transparent; font-size: 16px; }
.gap.st-ok { border-color: var(--ok); color: var(--ok); }
.gap.st-near { border-color: var(--near); color: var(--near); }
.gap.st-bad { border-color: var(--bad); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.gap.st-idk { border-color: var(--fg-3); color: var(--fg-3); }
.gap.shake { animation: shake 250ms ease-in-out; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.ex-foot { flex: none; display: flex; gap: 8px; padding-top: 10px; padding-bottom: 14px; background: var(--bg); }
.ex-foot .btn.pri { flex: 1; }
.ex-foot.abovekb { padding-bottom: 8px; }
.pattern { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--fg-2); }
.pattern span { padding: 5px 9px; border-radius: 8px; background: var(--surface-2); font-weight: 550; }
.pattern span.on { background: var(--act-soft); color: var(--act-text); }
.pagedots { display: flex; justify-content: center; gap: 6px; padding: 2px 0 10px; }
.pagedots i { width: 6px; height: 6px; border-radius: 3px; background: var(--surface-3); transition: width 220ms; }
.pagedots i.on { width: 18px; background: var(--fg-2); }

/* Rückmeldeband */
.band { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 45%; overflow: hidden; background: var(--surface); border-radius: 22px 22px 0 0; padding-top: 18px; padding-bottom: 14px; box-shadow: 0 -1px 0 var(--line), 0 -24px 48px -28px oklch(0 0 0 / 0.5); display: flex; flex-direction: column; gap: 10px; animation: bandUp 220ms var(--ease-spring) both; }
.band.s-ok { background: color-mix(in oklch, var(--surface) 90%, var(--ok)); }
.band.s-near { background: color-mix(in oklch, var(--surface) 90%, var(--near)); }
.band.s-bad { background: color-mix(in oklch, var(--surface) 91%, var(--bad)); }
@keyframes bandUp { from { transform: translateY(100%); } to { transform: none; } }
.verdict { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 650; line-height: 26px; }
.verdict .vi { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.s-ok .verdict { color: var(--ok); } .s-ok .vi { background: color-mix(in oklch, var(--ok) 20%, transparent); }
.s-near .verdict { color: var(--near); } .s-near .vi { background: color-mix(in oklch, var(--near) 20%, transparent); }
.s-bad .verdict { color: var(--bad); } .s-bad .vi { background: color-mix(in oklch, var(--bad) 20%, transparent); }
.s-idk .verdict { color: var(--fg); } .s-idk .vi { box-shadow: 0 0 0 2px var(--fg-3) inset; }
.cmp { font-size: 17px; line-height: 23px; color: var(--fg); }
.cmp .you { color: var(--fg-2); }
.cmp s { text-decoration-thickness: 1.5px; text-decoration-color: var(--bad); }
.cmp b { font-weight: 650; }
.whyl { font-size: 15px; line-height: 21px; color: var(--fg-2); margin: 0; }
.bandbtns { display: flex; gap: 8px; }
.bandbtns .btn { flex: 1; }
.hintband { position: absolute; left: 0; right: 0; z-index: 4; display: flex; align-items: center; gap: 10px; min-height: 48px; background: var(--surface-2); font-size: 16px; font-weight: 550; animation: bandUp 220ms var(--ease-spring) both; border-radius: 16px 16px 0 0; }
.hintband .ic { color: var(--act-text); }

/* Blätter */
.scrim { position: absolute; inset: 0; z-index: 8; background: var(--scrim); animation: fade 260ms ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 85%; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: sheetUp 500ms var(--ease-spring) both; box-shadow: 0 -30px 60px -30px oklch(0 0 0 / 0.6); }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 8px auto 4px; flex: none; }
.sheet h2 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 650; }
.sheet .sb { flex: 1; overflow-y: auto; padding-top: 8px; padding-bottom: 12px; }
.sheet .sf { flex: none; padding-top: 10px; padding-bottom: 14px; border-top: 1px solid var(--line); }
.menu { position: absolute; top: 56px; right: 12px; z-index: 9; width: 260px; background: var(--surface-2); border-radius: var(--r); box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 6px; animation: menuIn 220ms var(--ease-spring) both; transform-origin: top right; }
@keyframes menuIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 0 12px; border-radius: 10px; font-size: 16px; text-align: left; }
.menu button:active { background: var(--surface-3); }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 8px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg2 button { min-height: 38px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--fg-2); }
.seg2 button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px oklch(0 0 0 / 0.2); }

/* Inhaltsbausteine */
.card { background: var(--surface); border-radius: var(--r); padding: 18px; }
.lbl { font-size: 13px; color: var(--fg-2); font-weight: 550; }
.h2 { font-size: 20px; line-height: 26px; font-weight: 650; margin: 0; }
.p { font-size: 16px; line-height: 23px; margin: 0; color: var(--fg); }
.p2 { font-size: 15px; line-height: 21px; margin: 0; color: var(--fg-2); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.s6 { gap: 6px; } .stack.s8 { gap: 8px; } .stack.s16 { gap: 16px; } .stack.s24 { gap: 24px; }
.hr { height: 1px; background: var(--line); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 19px; }
.tbl th { text-align: left; font-weight: 600; color: var(--fg-2); font-size: 13px; padding: 0 8px 8px 0; vertical-align: bottom; }
.tbl td { padding: 9px 8px 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tbl td:first-child { color: var(--fg-2); width: 22%; }
.tbl .hl { color: var(--act-text); font-weight: 600; }
.contrast { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; font-size: 16px; line-height: 22px; }
.contrast .k { font-size: 12px; font-weight: 650; color: var(--fg-3); width: 22px; }
.contrast .no { color: var(--fg-3); text-decoration: line-through; text-decoration-color: var(--bad); }
.ex-list { display: flex; flex-direction: column; }
.ex-list div { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.ex-list div:first-child { border-top: 0; }
.ex-list b { font-weight: 550; font-size: 16px; }
.ex-list span { font-size: 13px; color: var(--fg-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--fg-2); }
.stagepill { font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 7px; background: var(--surface-2); color: var(--fg-2); }
.stagepill.s5 { background: var(--act-soft); color: var(--act-text); }
.choice { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: var(--r); background: var(--surface); font-size: 16px; font-weight: 550; text-align: left; width: 100%; box-shadow: 0 0 0 1px var(--line) inset; }
.choice .n { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; color: var(--fg-2); flex: none; }
.choice.sel { box-shadow: 0 0 0 2px var(--act) inset; }
.choice.ok { box-shadow: 0 0 0 2px var(--ok) inset; }
.quote { font-size: 17px; line-height: 24px; padding-left: 14px; border-left: 2px solid var(--line-2); }

/* Tastatur (angedeutet) */
.kbd { flex: none; background: var(--kb); padding: 6px 3px 0; position: relative; z-index: 3; }
.kbd .sug { display: grid; grid-template-columns: repeat(3, 1fr); height: 40px; align-items: center; text-align: center; color: var(--kb-fg); font-size: 15px; opacity: 0.85; }
.kbd .sug span + span { border-left: 1px solid oklch(0.5 0 0 / 0.35); }
.kbd .kr { display: flex; justify-content: center; gap: 6px; margin: 0 0 11px; }
.kbd .kk { height: 42px; flex: 1; max-width: 34px; border-radius: 6px; background: var(--kb-key); color: var(--kb-fg); display: grid; place-items: center; font-size: 22px; font-weight: 400; box-shadow: 0 1px 0 oklch(0 0 0 / 0.35); }
.kbd .kk.f { background: var(--kb-key-2); font-size: 15px; max-width: 44px; }
.kbd .kk.sp { max-width: none; flex: 5; font-size: 15px; }
.kbd .kk.go { max-width: 88px; flex: 2.2; font-size: 15px; background: var(--act); color: var(--act-fg); }
.kbd .kb-bot { display: flex; justify-content: space-between; align-items: center; padding: 2px 22px 12px; color: var(--kb-fg); height: 48px; }
.kbd .kb-bot .ic { width: 26px; height: 26px; opacity: 0.85; }
.kbd .tag { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 11px; color: var(--kb-fg); opacity: 0.5; }
.kbd .mic { position: relative; }
.kbd .mic.hl::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--act); animation: ring 1.6s ease-out infinite; }
.kbd .globe.hl::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--act); }
.kbd .globe { position: relative; }
@keyframes ring { 0% { opacity: 1; transform: scale(0.9); } 100% { opacity: 0; transform: scale(1.35); } }
.arrowtip { position: absolute; right: 64px; bottom: 12px; z-index: 4; display: flex; align-items: center; gap: 8px; background: var(--act); color: var(--act-fg); padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; animation: bob 1.4s ease-in-out infinite; }
.arrowtip::after { content: ''; position: absolute; right: -7px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right: 0; border-left-color: var(--act); }
@keyframes bob { 50% { transform: translateX(-4px); } }

/* Antwortfelder */
.field { width: 100%; min-height: 108px; resize: none; border: 0; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line-2) inset; padding: 14px 16px; font-size: 17px; line-height: 24px; color: var(--fg); position: relative; }
.field:focus { outline: none; box-shadow: 0 0 0 2px var(--act) inset; }
.fieldwrap { position: relative; }
.timeline { position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 1px; background: var(--surface-3); overflow: hidden; }
.timeline i { position: absolute; inset: 0 auto 0 0; width: 62%; background: var(--fg-3); }
.pinned { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--fg-2); min-height: 40px; padding-block: 4px 6px; }
.pinned b { color: var(--fg); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.persona { display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 650; font-size: 15px; color: var(--fg-2); flex: none; }
.bubble { max-width: 86%; padding: 12px 14px; border-radius: 18px; font-size: 16px; line-height: 22px; background: var(--surface); }
.bubble.me { align-self: flex-end; background: var(--act-soft); }
.bubble.them { align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.me { border-bottom-right-radius: 6px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--surface-2); font-size: 15px; line-height: 21px; }
.notice .ic { color: var(--fg-2); margin-top: 1px; }

/* Hören */
.player { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 8px 0; }
.playbtn { width: 128px; height: 128px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow), 0 0 0 1px var(--line) inset; display: grid; place-items: center; color: var(--fg); position: relative; }
.playbtn .ic { width: 44px; height: 44px; stroke-width: 1.6; }
.playbtn svg.prog { position: absolute; inset: -6px; width: 140px; height: 140px; transform: rotate(-90deg); }
.wave { display: flex; align-items: center; gap: 3px; height: 40px; }
.wave i { width: 3px; border-radius: 2px; background: var(--fg-3); }
.wave i.p { background: var(--fg); }
.speed { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); padding: 3px; border-radius: 12px; gap: 3px; width: 100%; max-width: 320px; }
.speed button { min-height: 40px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--fg-2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.speed button small { font-size: 11px; font-weight: 500; color: var(--fg-3); }
.speed button.on { background: var(--surface); color: var(--fg); }
.diffw { font-size: 19px; line-height: 30px; }
.diffw .x { color: var(--bad); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.diffw .m { color: var(--fg-3); }

/* Fortschritt */
.c1 { display: flex; flex-direction: column; gap: 12px; }
.c1 .s { font-size: 22px; line-height: 28px; font-weight: 650; text-wrap: balance; margin: 0; }
.c1band { position: relative; height: 54px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; min-height: 176px; text-align: left; min-width: 0; }
.tile .th { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--fg-2); line-height: 18px; }
.tile .th .tr { margin-left: auto; color: var(--fg-2); }
.tile .big { font-size: 32px; line-height: 38px; font-weight: 600; margin-top: 10px; }
.tile .big small { font-size: 17px; font-weight: 500; color: var(--fg-2); margin-left: 3px; letter-spacing: 0; }
.tile .way { white-space: nowrap; font-size: 17px; line-height: 22px; font-weight: 500; color: var(--fg-2); margin-top: 4px; }
.tile .wbar { margin-top: 12px; height: 8px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line-2) inset; position: relative; overflow: hidden; }
.tile .wbar i { position: absolute; top: 0; bottom: 0; }
.tile .wbar .f5 { left: 0; background: var(--fg); }
.tile .wbar .f34 { background: var(--fg); opacity: 0.4; }
.tile .one { font-size: 13px; line-height: 18px; color: var(--fg-2); margin-top: auto; padding-top: 10px; }
.trend { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; }

/* Vorführleiste (Werkzeug, bewusst anders gestaltet) */
.tool { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: 300px; max-width: 86vw; background: var(--tool); color: var(--tool-fg); font-size: 13px; display: flex; flex-direction: column; box-shadow: 1px 0 0 oklch(1 0 0 / 0.08), 20px 0 50px -20px oklch(0 0 0 / 0.6); transform: translateX(0); transition: transform 300ms var(--ease-soft); color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
.tool.closed { transform: translateX(-102%); box-shadow: none; }
.tool header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px dashed oklch(1 0 0 / 0.2); }
.tool header b { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
.tool header .tg { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--tool-mark); color: oklch(0.2 0.02 90); font-weight: 700; }
.tool header button { margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; }
.tool .tb { flex: 1; overflow-y: auto; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.tool .tl { font-size: 11px; color: oklch(0.72 0.01 90); font-weight: 600; letter-spacing: 0.04em; margin-bottom: 6px; }
.tool select { width: 100%; min-height: 40px; background: var(--tool-2); border: 1px solid oklch(1 0 0 / 0.12); border-radius: 8px; padding: 0 10px; color: var(--tool-fg); font-size: 14px; }
.tool .opts { display: flex; flex-wrap: wrap; gap: 4px; }
.tool .opts button { min-height: 32px; padding: 0 9px; border-radius: 7px; background: var(--tool-2); font-size: 12.5px; font-weight: 550; color: var(--tool-fg); }
.tool .opts button.on { background: var(--tool-mark); color: oklch(0.2 0.02 90); }
.tool .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tool .acts button { min-height: 40px; border-radius: 8px; border: 1px dashed oklch(1 0 0 / 0.3); font-size: 12.5px; font-weight: 600; }
.tool .nav2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.tool .nav2 button { min-height: 34px; border-radius: 8px; background: var(--tool-2); font-size: 12.5px; }
.tool .note { font-size: 11.5px; line-height: 16px; color: oklch(0.7 0.01 90); }
.toolhandle { position: fixed; z-index: 49; left: env(safe-area-inset-left, 0px); top: 50%; transform: translateY(-50%); width: 22px; height: 72px; border-radius: 0 10px 10px 0; background: var(--tool); color: var(--tool-mark); display: grid; place-items: center; box-shadow: 0 0 0 1px oklch(1 0 0 / 0.1); opacity: 0.8; }
.toolhandle span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
.measure { position: fixed; inset: 0; z-index: 60; background: oklch(0.12 0 0 / 0.92); color: oklch(0.97 0 0); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.measure .mv { font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.measure .ml { font-size: 14px; opacity: 0.75; margin-top: 6px; }
.measure button { min-height: 48px; padding: 0 24px; border-radius: 12px; background: oklch(0.97 0 0); color: oklch(0.15 0 0); font-weight: 650; }
.landhint { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-left, 0px)); font-size: 14px; color: var(--fg-2); }
.probe { font-size: 13px; color: var(--fg-2); padding: 8px max(16px, env(safe-area-inset-left, 0px)) 0; }

/* Bewegung aus */
[data-motion="off"] *, [data-motion="off"] *::before, [data-motion="off"] *::after {
  animation-name: fade !important; animation-duration: 120ms !important; animation-iteration-count: 1 !important;
  transition-property: opacity !important; transition-duration: 120ms !important;
}
[data-motion="off"] .sk { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-name: fade !important; animation-duration: 120ms !important; animation-iteration-count: 1 !important; transition-property: opacity !important; transition-duration: 120ms !important; }
}
.fadein { animation: fade 260ms ease both; }
.swap { animation: swapIn 300ms var(--ease-soft) both; }
@keyframes swapIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.springopen { animation: springOpen 420ms var(--ease-spring) both; transform-origin: top center; }
@keyframes springOpen { from { opacity: 0.4; transform: scale(0.94) translateY(-8px); } to { opacity: 1; transform: none; } }
.pulsing { animation: softPulse 2.4s ease-in-out infinite; }
@keyframes softPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--act-soft); } 50% { box-shadow: 0 0 0 10px transparent; } }

/* ---------- Laptop-Rahmen (em, Grundschrift über font-size am .desk) ---------- */
.desk { position: relative; display: flex; background: var(--bg); color: var(--fg); overflow: hidden; font-size: 16px; line-height: 1.45; flex: none; }
.desk .ic { width: 1.4em; height: 1.4em; }
.side { flex: none; width: 14.5em; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 1em 0.75em; gap: 0.25em; background: var(--bg); }
.desk.rail .side { width: 4.75em; align-items: center; padding: 1em 0.5em; }
.desk.rail .side .lbl2, .desk.rail .side .sub, .desk.rail .side .wm b { display: none; }
.wm { display: flex; align-items: center; gap: 0.6em; padding: 0.25em 0.6em 1.1em; font-weight: 700; font-size: 1.05em; }
.wm svg { width: 1.6em; height: 1.6em; }
.nav { display: flex; align-items: center; gap: 0.75em; min-height: 2.5em; padding: 0 0.7em; border-radius: 0.6em; color: var(--fg-2); font-size: 0.95em; font-weight: 550; width: 100%; text-align: left; }
.desk.rail .nav { justify-content: center; padding: 0; width: 3em; height: 3em; }
.nav:hover { background: var(--surface); color: var(--fg); }
.nav.on { background: var(--act-soft); color: var(--act-text); }
.nav.sub { min-height: 2.1em; padding-left: 2.85em; font-size: 0.88em; }
.side .sp { flex: 1; }
.dmain { flex: 1; min-width: 0; display: flex; justify-content: center; gap: 0; padding: 0 2.5em; overflow: hidden; }
.stage { flex: 1 1 auto; max-width: 45em; min-width: 0; display: flex; flex-direction: column; position: relative; }
.ctx { flex: none; width: 24em; border-left: 1px solid var(--line); padding: 1.5em 0 1.5em 2em; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5em; }
.desk.bp-mid .stage { max-width: 42.5em; }
.desk.bp-mid .ctx { width: 20em; padding-left: 1.5em; }
.desk.bp-mid .dmain { gap: 0; padding: 0 1em; }
.desk.bp-xl .stage { max-width: 50em; }
.desk.bp-xl .ctx { width: 27.5em; }
.desk.bp-narrow .ctx { display: none; }
.desk.bp-narrow .stage { max-width: 45em; }
.dscroll { flex: 1; overflow-y: auto; padding: 2em 0 2.5em; }
.dscroll::-webkit-scrollbar { width: 0; }
.dh1 { font-size: 1.9em; line-height: 1.2; font-weight: 700; margin: 0 0 1em; }
.ctx h3 { margin: 0 0 0.6em; font-size: 0.95em; font-weight: 650; }
.ctx .p2, .ctx .p { font-size: 0.95em; line-height: 1.5; }
.dtop { display: flex; align-items: center; gap: 1em; min-height: 4em; flex: none; }
.dtop .bar { height: 0.4em; }
.dtop .iconbtn { width: 2.5em; height: 2.5em; margin: 0; }
.keys { flex: none; display: flex; align-items: center; gap: 0.5em; padding: 1em 0 1.5em; border-top: 1px solid var(--line); }
.keys .btn { min-height: 3em; font-size: 0.95em; padding: 0 1.1em; }
.keys .grow { flex: 1; }
.keys .btn.pri { min-width: 11em; }
.dverdict { display: flex; flex-direction: column; gap: 0.4em; padding: 1em 1.2em; border-radius: var(--r); animation: swapIn 220ms var(--ease-soft) both; }
.dverdict.s-ok { background: color-mix(in oklch, var(--surface) 88%, var(--ok)); }
.dverdict.s-near { background: color-mix(in oklch, var(--surface) 88%, var(--near)); }
.dverdict.s-bad { background: color-mix(in oklch, var(--surface) 90%, var(--bad)); }
.dverdict.s-idk { background: var(--surface); }
.desk .verdict { font-size: 1.15em; }
.desk .verdict .vi { width: 1.6em; height: 1.6em; }
.desk .cmp { font-size: 1.05em; }
.desk .prompt { font-size: 2.2em; line-height: 1.2; }
.desk .sent { font-size: 1.5em; line-height: 1.6; }
.desk .gap.big { font-size: 1.9em; line-height: 1.3; }
.desk .card { padding: 1.25em; }
.desk .p { font-size: 1em; }
.desk .tbl { font-size: 0.9em; }
.desk .btn { font-size: 1em; min-height: 3.1em; }
.desk .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9em; }
.desk .tile { padding: 1.25em; min-height: 13em; }
.desk .tile .th { font-size: 0.95em; }
.desk .tile .big { font-size: 2.5em; line-height: 1.15; }
.desk .tile .way { font-size: 1.25em; line-height: 1.3; }
.desk .tile .one { font-size: 0.95em; }
.desk .tile .wbar { height: 0.55em; }
.kbdhelp { position: absolute; inset: 0; z-index: 10; background: var(--scrim); display: grid; place-items: center; animation: fade 200ms both; }
.kbdhelp .card { width: 26em; box-shadow: var(--shadow); }
.kbdhelp dl { display: grid; grid-template-columns: auto 1fr; gap: 0.7em 1.2em; margin: 1em 0 0; font-size: 0.95em; }
.kbdhelp dt { font-weight: 650; }
.kbdhelp dt span { display: inline-block; min-width: 1.8em; text-align: center; padding: 0.1em 0.45em; border-radius: 0.4em; border: 1px solid var(--line-2); background: var(--surface-2); }
.kbdhelp dd { margin: 0; color: var(--fg-2); }
.mark-reg { background: color-mix(in oklch, var(--ch-gram) 22%, transparent); border-radius: 0.3em; box-shadow: 0 2px 0 var(--ch-gram); cursor: pointer; }
.mark-lang { background: color-mix(in oklch, var(--bad) 18%, transparent); border-radius: 0.3em; box-shadow: 0 2px 0 var(--bad); }
.mark-good { background: color-mix(in oklch, var(--ok) 16%, transparent); border-radius: 0.3em; box-shadow: 0 2px 0 var(--ok); }
.mark-str { background: color-mix(in oklch, var(--ch-listen) 18%, transparent); border-radius: 0.3em; box-shadow: 0 2px 0 var(--ch-listen); }
.mailtext { font-size: 1.1em; line-height: 1.75; max-width: 42em; }
.mailtext p { margin: 0 0 0.9em; }
.cat { display: flex; flex-direction: column; gap: 0.3em; padding: 0.9em 0; border-top: 1px solid var(--line); }
.cat:first-of-type { border-top: 0; }
.cat .ct { display: flex; align-items: center; gap: 0.6em; font-weight: 650; font-size: 0.95em; }
.cat .sw { width: 0.9em; height: 0.9em; border-radius: 0.25em; }
.probeframe { box-shadow: 0 0 0 1px var(--line-2); border-radius: 12px; overflow: hidden; transform-origin: top left; }

/* ---------- Ergänzungen ---------- */
/* Ring zeichnet sich beim Start (nur einmal je Laden oder „Start nachspielen“) */
.ring.draw .seg.on { stroke-dasharray: 100 100; animation: ringDraw 700ms var(--ease-soft) both; animation-delay: var(--d, 0ms); }
@keyframes ringDraw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
/* Echte Bildschirmtastatur offen: gezeichnete Tastatur ausblenden, Fläche über der Tastatur halten */
.realkb .kbd { display: none; }
.realkb .ph:not(.framed) { height: calc(100% - var(--kbh, 0px)); }
.hintband { border-radius: 16px 16px 0 0; }

/* Paket A „Wörter“ (Nora-A). Präfix tw-. Nur Tokens; Maße in em, damit Handy (16 px) und Laptop (16–20 px) dieselben Bausteine nutzen. */

/* ---------- H1 Heute: ruhige Zusatzwege ---------- */
.tw-quiet { display: block; margin: 0.25em auto 0; min-height: 2.75em; padding: 0 1em; font-size: 0.94em; font-weight: 550; color: var(--fg-2); border-radius: var(--r); }
.tw-quiet:active { background: var(--surface-2); }
.tw-restart { margin-top: 1.4em; padding: 1em 1.1em 0.9em; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.tw-rs-h { display: flex; flex-direction: column; gap: 0.15em; font-weight: 650; font-size: 0.95em; }
.tw-rs-h span { font-weight: 450; font-size: 0.9em; color: var(--fg-2); }
.tw-rs-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.6em; margin-top: 0.9em; height: 6.4em; align-items: end; }
.tw-rs-d { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 0.25em; }
.tw-rs-d i { display: block; width: 100%; max-width: 2.6em; border-radius: 0.45em; background: var(--surface-3); min-height: 0.4em; max-height: calc(100% - 2.6em); }
.tw-rs-d.on i { background: var(--act); }
.tw-rs-d b { font-size: 0.8em; font-weight: 650; line-height: 1; }
.tw-rs-d span { font-size: 0.75em; color: var(--fg-3); line-height: 1; }
.tw-rs-d.on span { color: var(--act-text); font-weight: 650; }
.tw-notice { margin-top: 0; }
.gx > .tw-notice:first-child { margin-top: 1.2em; }
.tw-notice b { font-weight: 650; }

/* ---------- H2 Mehr-Blatt ---------- */
.tw-trans { display: flex; flex-direction: column; gap: 0.3em; padding: 0.85em 1em; border-radius: var(--r); background: var(--surface-2); }
.tw-trans b { font-weight: 600; font-size: 1.02em; line-height: 1.4; }
.tw-trans span { font-size: 0.94em; line-height: 1.4; color: var(--fg-2); }
.tw-hook { display: flex; gap: 0.75em; align-items: flex-start; padding: 0.85em 1em; border-radius: var(--r); background: color-mix(in oklch, var(--surface-2) 80%, var(--act)); }
.tw-hook .ic { color: var(--act-text); flex: none; margin-top: 0.1em; }

/* ---------- H12 Wörter ---------- */
.tw-practice { display: flex; align-items: center; gap: 1em; padding: 1em 1em 1em 1.15em; border-radius: calc(var(--r) + 4px); background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.tw-pt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.15em; }
.tw-pt b { font-size: 1.06em; font-weight: 650; }
.tw-pt span { font-size: 0.85em; line-height: 1.35; color: var(--fg-2); }
.tw-practice .btn { flex: none; min-width: 6.5em; }
.tw-chiprow { display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none; }
.tw-chiprow::-webkit-scrollbar { display: none; }
.tw-restrow .rt b { color: var(--fg-2); }
.tw-restrow .rt span { color: var(--fg-3); }
.tw-lockic { display: inline-grid; place-items: center; color: var(--fg-3); }
.tw-selrow { background: var(--surface); padding-left: 0.8em; padding-right: 0.8em; border-radius: var(--r); border-bottom-color: transparent; }
.tw-wact .btn.pri { min-height: 3.25em; }
.tw-wagrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5em; }
.tw-wa { display: flex; align-items: center; gap: 0.6em; min-height: 3em; padding: 0 0.9em; border-radius: var(--r); background: var(--surface-2); color: var(--fg); font-weight: 600; font-size: 0.94em; text-align: left; }
.tw-wa .ic { color: var(--fg-2); flex: none; }
.tw-wa:active { transform: scale(0.98); }
.tw-wa[aria-pressed="true"] { background: var(--act-soft); color: var(--act-text); }
.tw-empty { display: flex; flex-direction: column; gap: 0.6em; padding: 1em; border-radius: var(--r); background: var(--surface); }
.tw-empty b { font-weight: 600; font-size: 1em; line-height: 1.35; }
.tw-empty > span { font-size: 0.85em; color: var(--fg-2); }
.tw-switch { flex: none; width: 2.75em; height: 1.6em; border-radius: 1em; background: var(--surface-3); position: relative; }
.tw-switch i { position: absolute; top: 0.2em; left: 0.2em; width: 1.2em; height: 1.2em; border-radius: 50%; background: var(--fg-2); }

/* ---------- Gemeinsame Bausteine ---------- */
.tw-badge { display: inline-flex; align-items: center; height: 1.55em; padding: 0 0.55em; border-radius: 0.45em; font-size: 0.75em; font-weight: 700; letter-spacing: 0.02em; color: var(--fg-2); box-shadow: 0 0 0 1px var(--line-2) inset; flex: none; vertical-align: middle; }
.tw-tag { display: inline-flex; align-items: center; gap: 0.3em; padding: 0.1em 0.5em; border-radius: 0.4em; font-size: 0.75em; font-weight: 600; color: var(--fg-2); background: var(--surface-2); white-space: nowrap; }
.tw-note { display: flex; gap: 0.5em; align-items: flex-start; margin: 0; font-size: 0.85em; line-height: 1.4; color: var(--fg-2); }
.tw-note .ic { flex: none; margin-top: 0.15em; color: var(--fg-3); }
.tw-hl { display: flex; align-items: center; gap: 0.25em; min-width: 0; }
.tw-hl h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; }
.tw-in { min-height: 0; font-size: 1em; padding: 0.8em 1em; display: flex; align-items: center; }
.tw-focus { box-shadow: 0 0 0 2px var(--act) inset; }
.tw-focus .caret { width: 2px; height: 1.1em; background: var(--act-text); margin-left: 2px; animation: blink 1s steps(1) infinite; }

/* ---------- Trainer-Rahmen ---------- */
.tw-top { gap: 0.65em; }
.tw-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; position: relative; }
.tw-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--act); transition: width 380ms var(--ease-soft); }
.tw-count { font-size: 0.85em; font-weight: 650; color: var(--fg-2); white-space: nowrap; }
.tw-count em { font-style: normal; color: var(--act-text); }
.tw-lage { display: flex; gap: 0.5em; align-items: flex-start; margin: 0.15em 0 0.35em; font-size: 0.85em; line-height: 1.4; color: var(--fg-2); }
.tw-lage .ic { flex: none; margin-top: 0.15em; }
.tw-said { font-size: 1.25em; line-height: 1.45; font-weight: 550; padding: 0.7em 0.9em; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.tw-said.st-ok { box-shadow: 0 0 0 1.5px var(--ok) inset; }
.tw-said.st-near { box-shadow: 0 0 0 1.5px var(--near) inset; }
.tw-said.st-bad { box-shadow: 0 0 0 1.5px var(--bad) inset; }
.tw-said.st-idk { color: var(--fg-2); }
.tw-play { width: 6em; height: 6em; border-radius: 50%; display: grid; place-items: center; background: var(--act-soft); color: var(--act-text); align-self: center; }
.tw-play .ic { width: 2em; height: 2em; }
.tw-play:active { transform: scale(0.96); }
.tw-micwrap { display: flex; flex-direction: column; align-items: center; gap: 0.6em; padding-top: 1.2em; font-size: 0.85em; color: var(--fg-2); }
.tw-mic { width: 5.6em; height: 5.6em; border-radius: 50%; display: grid; place-items: center; background: var(--act); color: var(--act-fg); box-shadow: 0 0 0 0.6em var(--act-soft); }
.tw-mic .ic { width: 1.9em; height: 1.9em; }
.tw-ctr { padding: 0.9em 1.1em; }
.tw-de { font-family: var(--font); font-size: 0.85em; color: var(--fg-2); font-weight: 450; }

/* ---------- H17 / L11 Trainer-Start ---------- */
.tw-hero { display: flex; flex-direction: column; gap: 0.75em; padding: 1.2em 1.15em 1.15em; border-radius: calc(var(--r) + 6px); background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.tw-hero.tw-sub { background: transparent; }
.tw-hero .btn { margin-top: 0.25em; }
.tw-big { font-size: 1.75em; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
.tw-mid { font-size: 1.3em; line-height: 1.25; font-weight: 650; }
.tw-hero .p2 b { color: var(--fg); font-weight: 600; }
.tw-words { display: flex; flex-wrap: wrap; gap: 0.35em; }
.tw-words span { padding: 0.25em 0.6em; border-radius: 0.5em; background: var(--surface-2); font-size: 0.85em; font-weight: 550; color: var(--fg); }
.tw-meta { display: flex; flex-wrap: wrap; gap: 0.25em 0.9em; margin: 0; font-size: 0.85em; color: var(--fg-2); }
.tw-meta span + span::before { content: '·'; margin-right: 0.9em; color: var(--fg-3); }
.tw-newcard { display: flex; align-items: center; justify-content: space-between; gap: 0.75em; padding: 0.8em 0.95em; border-radius: var(--r); background: var(--surface-2); }
.tw-newcard div { display: flex; flex-direction: column; gap: 0.1em; min-width: 0; }
.tw-newcard b { font-size: 1.15em; font-weight: 650; }
.tw-newcard div span { font-size: 0.85em; color: var(--fg-2); }
.tw-adj { display: flex; align-items: center; gap: 0.75em; width: 100%; min-height: 3.4em; padding: 0 1em; border-radius: var(--r); background: var(--surface-2); text-align: left; font-weight: 600; }
.tw-adj .tw-sum { flex: 1; min-width: 0; font-size: 0.85em; font-weight: 450; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.tw-adj .ic { color: var(--fg-3); flex: none; }
.tw-adjbody { display: flex; flex-direction: column; gap: 1em; padding: 0.2em 0.1em 0.4em; }
.tw-grp { display: flex; flex-direction: column; gap: 0.5em; }
.tw-chips { display: flex; flex-wrap: wrap; gap: 0.4em; }
.tw-chip { display: inline-flex; align-items: center; gap: 0.35em; min-height: 2.5em; padding: 0 0.85em; border-radius: 0.65em; background: var(--surface-2); color: var(--fg); font-size: 0.9em; font-weight: 550; box-shadow: 0 0 0 1px transparent inset; transition: background 140ms, box-shadow 140ms; }
.tw-chip .num { color: var(--fg-3); font-weight: 600; font-size: 0.9em; }
.tw-chip.on { background: var(--act-soft); color: var(--act-text); box-shadow: 0 0 0 1.5px var(--act) inset; }
.tw-chip.on .num { color: var(--act-text); opacity: 0.8; }
.tw-lockline { display: flex; gap: 0.5em; align-items: flex-start; margin: 0; padding: 0 0.1em; font-size: 0.85em; line-height: 1.4; color: var(--fg-3); }
.tw-lockline .ic { flex: none; margin-top: 0.15em; }

/* ---------- H19 / L13 Anki ---------- */
.tw-card { display: flex; flex-direction: column; gap: 0.9em; padding: 1.8em 1.3em; border-radius: calc(var(--r) + 6px); background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset, var(--shadow); text-align: center; }
.tw-card.flipped { animation: springOpen 420ms var(--ease-spring) both; }
.tw-cardsent { margin: 0; font-size: 1em; line-height: 1.5; color: var(--fg-2); text-wrap: pretty; }
.tw-cardline { height: 1px; background: var(--line); margin: 0.2em -0.4em; }
.tw-back { display: flex; flex-direction: column; gap: 0.4em; align-items: center; }
.tw-mean { font-size: 1.6em; line-height: 1.25; font-weight: 650; }
.tw-rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4em; }
.tw-rb { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1em; min-height: 3.6em; border-radius: var(--r); background: var(--surface-2); }
.tw-rb b { font-size: 0.94em; font-weight: 650; }
.tw-rb span { font-size: 0.78em; color: var(--fg-2); }
.tw-rb i { display: none; }
.tw-rb:active { transform: scale(0.97); }
#tw-r-good { background: var(--act-soft); color: var(--act-text); }
#tw-r-good span { color: var(--act-text); }
.tw-footnote { margin: -0.4em 0 0.9em; font-size: 0.78em; color: var(--fg-3); text-align: center; }
.tw-undo { position: absolute; left: 12px; right: 12px; bottom: 96px; z-index: 6; display: flex; align-items: center; gap: 0.75em; padding: 0.35em 0.5em 0.35em 1em; border-radius: var(--r); background: var(--fg); color: var(--bg); font-size: 0.92em; box-shadow: var(--shadow); overflow: hidden; animation: swapIn 220ms var(--ease-soft) both; }
.tw-undo span { flex: 1; min-width: 0; }
.tw-undo .link { color: var(--bg); text-decoration: underline; text-underline-offset: 0.2em; padding: 0 0.6em; }
.tw-undo i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--act); transform-origin: left; animation: twUndo 5s linear both; }
.tw-undo-d { position: relative; left: auto; right: auto; bottom: auto; max-width: 34em; margin: 0 auto; width: 100%; }
@keyframes twUndo { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.desk .tw-drb { flex-direction: row; gap: 0.5em; }
.desk .tw-drb .tw-iv { font-size: 0.85em; color: var(--fg-2); font-weight: 500; }

/* ---------- H20 / L14 Ergebnis ---------- */
.tw-resicon { display: grid; place-items: center; }
.tw-resicon span { width: 4em; height: 4em; border-radius: 50%; display: grid; place-items: center; background: var(--act-soft); color: var(--act-text); animation: springOpen 520ms var(--ease-spring) both; }
.tw-resicon .ic { width: 1.8em; height: 1.8em; }
.tw-res .st { border-bottom-color: var(--line); }
.tw-st-step { color: var(--fg); }
.tw-step { display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--act); color: var(--act-fg); }
.tw-step .ic { width: 1em; height: 1em; }
.tw-mk-ok { background: color-mix(in oklch, var(--ok) 22%, transparent) !important; color: var(--ok) !important; }
.tw-mk-near { background: color-mix(in oklch, var(--near) 24%, transparent) !important; color: var(--near) !important; }
.tw-mk-bad { background: color-mix(in oklch, var(--bad) 20%, transparent) !important; color: var(--bad) !important; }
.tw-rr .nm { color: var(--fg) !important; }
.tw-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25em; }
.tw-legend .ic { width: 1em; height: 1em; }

/* ---------- H21 Wörter sammeln ---------- */
.tw-search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 16px; color: var(--fg); }
.tw-art { font-size: 19px; line-height: 31px; padding: 0.6em 0 1em; }
.tw-art .w.sel { background: var(--act-soft); box-shadow: 0 2px 0 var(--act); }
.tw-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5em; }
.tw-mode { display: flex; flex-direction: column; gap: 0.25em; align-items: flex-start; text-align: left; padding: 0.85em 0.9em; border-radius: var(--r); background: var(--surface-2); box-shadow: 0 0 0 1px transparent inset; }
.tw-mode b { font-size: 0.95em; font-weight: 650; }
.tw-mode span { font-size: 0.8em; line-height: 1.35; color: var(--fg-2); }
.tw-mode.on { background: var(--act-soft); box-shadow: 0 0 0 2px var(--act) inset; }
.tw-mode.on b { color: var(--act-text); }
.tw-mode.off { opacity: 0.45; }
.tw-src { padding: 0.9em 1em; border-radius: var(--r); background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; font-size: 0.94em; line-height: 1.5; color: var(--fg-2); }
.tw-pick .ck { width: 1.5em; height: 1.5em; flex: none; }

/* ---------- H22 Tempo ---------- */
.tw-time { position: relative; display: flex; align-items: center; gap: 0.75em; margin-top: 1.4em; }
.tw-time .timeline { position: relative; left: auto; right: auto; bottom: auto; flex: 1; height: 4px; border-radius: 2px; }
.tw-time .timeline i { background: var(--act); }
.tw-time span { font-size: 0.85em; font-weight: 650; color: var(--fg-2); }
.tw-ti { padding: 0.6em 0; border-bottom: 1px solid var(--line); }
.tw-ti:last-child { border-bottom: 0; }
.tw-tr { display: flex; align-items: center; gap: 0.7em; font-size: 0.94em; }
.tw-tq { flex: 1; min-width: 0; color: var(--fg-2); }
.tw-tr b { font-weight: 600; }
.tw-tx { display: flex; flex-direction: column; gap: 0.3em; padding: 0.5em 0 0.2em 2.1em; }
.tw-tx .cmp { font-size: 0.94em; line-height: 1.4; }
.tw-tx .p2 { font-size: 0.85em; line-height: 1.4; }

/* ---------- H23 Verwalten ---------- */
.tw-danger .ri { color: var(--bad); background: color-mix(in oklch, var(--bad) 14%, transparent); }
.tw-danger .rt b { color: var(--bad); }
.tw-delbtn { color: var(--bad); }
.tw-dim { opacity: 0.55; filter: saturate(0.6); }

/* ---------- H15 gespeichert ---------- */
.tw-saved { display: flex; align-items: center; gap: 0.6em; margin-bottom: 0.6em; padding: 0.3em 0.4em 0.3em 0.8em; border-radius: var(--r); background: var(--surface-2); font-size: 0.9em; line-height: 1.35; animation: swapIn 220ms var(--ease-soft) both; }
.tw-saved > span:nth-child(2) { flex: 1; min-width: 0; }
.tw-savedic { display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; flex: none; background: color-mix(in oklch, var(--ok) 22%, transparent); color: var(--ok); }
.tw-saved .link { flex: none; padding: 0 0.5em; }
.tw-nosave { margin: 0.6em 0 0; }

/* ---------- Laptop ---------- */
.tw-dhead { display: flex; align-items: center; gap: 0.75em; margin-bottom: 1.2em; }
.tw-dhead .grow { flex: 1; }
.tw-dhead .btn { min-height: 2.75em; font-size: 0.95em; }
.tw-dsub { margin: -0.8em 0 1.2em !important; font-size: 0.9em !important; }
.tw-fin { min-height: 2.5em !important; font-size: 0.9em !important; padding: 0 0.8em !important; }
.desk .tw-top { gap: 1em; }
.desk .tw-bar { height: 0.4em; }
.desk .tw-hero { padding: 1.5em 1.6em; }
.desk .tw-hero .btn.pri { align-self: flex-start; min-width: 16em; }
.desk .tw-big { font-size: 2em; }
.tw-adjd { padding: 1.1em 1.2em; border-radius: calc(var(--r) + 4px); box-shadow: 0 0 0 1px var(--line) inset; }
.tw-prev { font-size: 0.92em; }
.tw-pv { display: flex; align-items: center; gap: 0.6em; min-height: 2.3em; border-bottom: 1px solid var(--line); }
.tw-pv:last-child { border-bottom: 0; }
.tw-pn { width: 1.3em; color: var(--fg-3); font-size: 0.85em; text-align: right; flex: none; }
.tw-pv b { font-weight: 600; white-space: nowrap; }
.tw-pm { flex: 1; min-width: 0; color: var(--fg-2); font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tw-counts { gap: 0.6em; }
.tw-cl { display: flex; gap: 0.6em; align-items: flex-start; margin: 0; font-size: 0.92em; line-height: 1.45; color: var(--fg-2); }
.tw-cl b { color: var(--fg); font-weight: 600; }
.tw-ci { flex: none; display: grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; background: var(--surface-2); color: var(--fg-2); margin-top: 0.05em; }
.tw-ci.ok { background: color-mix(in oklch, var(--ok) 20%, transparent); color: var(--ok); }
.tw-ci.bad { background: color-mix(in oklch, var(--bad) 18%, transparent); color: var(--bad); }
.tw-ci .ic { width: 0.95em; height: 0.95em; }
.desk .tw-wa { min-height: 2.8em; }
.desk .tw-card { padding: 2.2em 2em; }
.desk .tw-play { width: 5em; height: 5em; }

/* Paket B „Rund um den Tag“ (H24–H32, L15–L17). Nur tm-Klassen, nur Tokens aus style.css. */

/* Unterseiten-Titel */
.tm-title { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; }
.tm-sub { font-size: 15px; line-height: 21px; color: var(--fg-2); margin: 0; }

/* Einstellungs-Gruppen: Zeilenliste in einer Karte */
.tm-group { display: flex; flex-direction: column; gap: 6px; }
.tm-group > .lbl { padding: 0 2px; }
.tm-list { background: var(--surface); border-radius: var(--r); padding: 0 16px; }
.tm-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; font-size: 16px; line-height: 21px; color: var(--fg); }
.tm-row:last-child { border-bottom: 0; }
.tm-row .tm-k { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tm-row .tm-k small { font-size: 13px; line-height: 18px; color: var(--fg-2); }
.tm-row .tm-v { flex: none; max-width: 52%; text-align: right; font-size: 15px; color: var(--fg-2); }
.tm-row .tm-fix { flex: none; font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 7px; background: var(--surface-2); color: var(--fg-2); }
.tm-row .chev { color: var(--fg-3); flex: none; }
.tm-row.tm-tall { align-items: flex-start; padding: 12px 0; }

/* Schalter */
.tm-sw { flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--surface-3); position: relative; transition: background 200ms var(--ease-soft); }
.tm-sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: transform 260ms var(--ease-spring); box-shadow: 0 1px 3px oklch(0 0 0 / 0.25); }
.tm-sw.on { background: var(--act); }
.tm-sw.on::after { transform: translateX(18px); background: var(--act-fg); }

/* Segmentwahl mit beliebig vielen Teilen */
.tm-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.tm-seg button { min-height: 38px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--fg-2); padding: 0 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.tm-seg button small { font-size: 11px; font-weight: 500; color: var(--fg-3); }
.tm-seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px oklch(0 0 0 / 0.2); }

/* Auswahl-Kreis (Stimme, Fokus) */
.tm-radio { flex: none; width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--line-2) inset; display: grid; place-items: center; }
.tm-radio.on { box-shadow: 0 0 0 2px var(--act) inset; }
.tm-radio.on::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--act); }

/* Schlüssel-Wert-Liste (Diagnose, Messwerte) */
.tm-kv { display: grid; grid-template-columns: fit-content(58%) minmax(0, 1fr); gap: 0; font-size: 15px; line-height: 21px; }
.tm-kv > * { padding: 10px 0; border-top: 1px solid var(--line); }
.tm-kv > :nth-child(-n+2) { border-top: 0; }
.tm-kv .tm-kl { color: var(--fg-2); }
.tm-kv .tm-kr { text-align: right; font-weight: 600; padding-left: 12px; }
.tm-log { font-size: 13px; line-height: 19px; color: var(--fg-2); display: flex; flex-direction: column; gap: 6px; }
.tm-log span { color: var(--fg-3); margin-right: 6px; }

/* Ampelzeilen und Zustands-Chips */
.tm-light { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; line-height: 22px; }
.tm-light:first-child { border-top: 0; }
.tm-light i { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.tm-light i.g { background: var(--ok); }
.tm-light i.y { background: var(--near); }
.tm-light i.r { background: var(--bad); }
.tm-light small { display: block; font-size: 13px; line-height: 18px; color: var(--fg-2); margin-top: 2px; }
.tm-light .tm-lv { margin-left: auto; flex: none; font-weight: 650; padding-left: 8px; }
.tm-state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 7px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.tm-state.open { color: var(--fg); }
.tm-state.rec { background: color-mix(in oklch, var(--near) 18%, transparent); color: var(--near); }
.tm-state.fixed, .tm-state.firm { background: color-mix(in oklch, var(--ok) 16%, transparent); color: var(--ok); }

/* Fehlerzeilen */
.tm-err { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.tm-err:last-child { border-bottom: 0; }
.tm-err .tm-w { font-size: 15px; line-height: 21px; color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 1.5px; }
.tm-err .tm-r { font-size: 16px; line-height: 22px; font-weight: 600; }
.tm-err .tm-m { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-2); flex-wrap: wrap; }

/* Kleine Punktreihe (Fortschritt einer Regel, Stufen) */
.tm-pips { display: flex; gap: 4px; }
.tm-pips i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); }
.tm-pips i.on { background: var(--act); }
.tm-pips i.ok { background: var(--ok); }

/* Vorher → nachher */
.tm-ba { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; font-size: 14px; color: var(--fg-2); }
.tm-ba .tm-track { height: 8px; border-radius: 4px; background: var(--surface-3); position: relative; overflow: hidden; }
.tm-ba .tm-track b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--fg-3); }
.tm-ba .tm-track b.now { background: var(--act); animation: tmGrow 700ms var(--ease-soft) both; transform-origin: left center; }
.tm-ba .tm-n { color: var(--fg); font-weight: 650; text-align: right; }
@keyframes tmGrow { from { transform: scaleX(0); } to { transform: none; } }

/* Mail am Handy: nur die Markierungen der aktuellen Kategorie */
.tm-mail { font-size: 16px; line-height: 26px; }
.tm-mail p { margin: 0 0 10px; }
.tm-mail p:last-child { margin-bottom: 0; }
.tm-mail .tm-off { background: none; box-shadow: none; }
.tm-mail [class^="mark-"] { transition: background 220ms var(--ease-soft), box-shadow 220ms var(--ease-soft); }
.tm-count { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); min-height: 32px; }
.tm-count .ck { width: 16px; height: 16px; }
.tm-count span { display: inline-flex; align-items: center; gap: 6px; }

/* Vollbild-Moment Kapitel */
.tm-badge { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; background: var(--act-soft); color: var(--act-text); box-shadow: 0 0 0 1px var(--line) inset; animation: springOpen 520ms var(--ease-spring) both; }
.tm-badge b { font-size: 44px; line-height: 1; font-weight: 700; }

/* Meilenstein-Kurve */
.tm-curve { position: relative; }
.tm-curve svg { width: 100%; height: 170px; display: block; overflow: visible; }
.tm-curve .tm-yl { position: absolute; left: 0; font-size: 11px; color: var(--fg-3); font-weight: 600; transform: translateY(-50%); }

/* Laptop: Gruppen links, Inhalt rechts */
.tm-split { display: grid; grid-template-columns: 13em minmax(0, 1fr); gap: 2em; align-items: start; }
.tm-gnav { display: flex; flex-direction: column; gap: 0.2em; position: sticky; top: 0; }
.tm-gnav button { display: flex; align-items: center; gap: 0.7em; min-height: 2.5em; padding: 0 0.8em; border-radius: 0.6em; color: var(--fg-2); font-size: 0.95em; font-weight: 550; text-align: left; }
.tm-gnav button:hover { background: var(--surface); color: var(--fg); }
.tm-gnav button.on { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line) inset; }
.desk .tm-title { font-size: 1.9em; line-height: 1.2; }
.desk .tm-list { padding: 0 1.1em; }
.desk .tm-row { min-height: 3.3em; font-size: 1em; line-height: 1.35; padding: 0.55em 0; }
.desk .tm-row .tm-k small { font-size: 0.85em; line-height: 1.35; }
.desk .tm-row .tm-v { font-size: 0.95em; }
.desk .tm-kv { font-size: 0.95em; line-height: 1.4; }
.desk .tm-kv > * { padding: 0.6em 0; }
.desk .tm-light { font-size: 1em; line-height: 1.4; padding: 0.75em 0; }
.desk .tm-light small { font-size: 0.85em; }
.desk .tm-err { padding: 0.75em 0; }
.desk .tm-err .tm-w { font-size: 0.95em; }
.desk .tm-err .tm-r { font-size: 1em; }
.desk .tm-err .tm-m { font-size: 0.85em; }
.desk .tm-seg button { min-height: 2.4em; font-size: 0.9em; }
.desk .tm-ba { font-size: 0.9em; }
.desk .tm-err.tm-sel { background: var(--surface-2); padding-left: 0.75em; padding-right: 0.75em; border-radius: 10px; box-shadow: inset 3px 0 0 var(--act); }

@media (prefers-reduced-motion: reduce) {
  .tm-ba .tm-track b.now, .tm-badge { animation: none; }
}

function ringSvg(blocks, done, partial, opts) {
  opts = opts || {};
  const T = blocks.reduce((a, b) => a + b.m, 0);
  const cx = 100, cy = 100, r = 86, gap = 8;
  let a = -90, out = '';
  const pt = deg => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  blocks.forEach((b, i) => {
    const span = b.m / T * 360;
    const a0 = a + gap / 2, a1 = a + span - gap / 2;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const large = a1 - a0 > 180 ? 1 : 0;
    const d = 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
    out += '<path class="seg trk" d="' + d + '"/>';
    if (i < done) out += '<path class="seg on" pathLength="100" style="--d:' + (i * 90) + 'ms" d="' + d + '"/>';
    else if (i === done && partial > 0) out += '<path class="seg on" pathLength="100" stroke-dasharray="' + (partial * 100).toFixed(1) + ' 100" style="--d:' + (i * 90) + 'ms" d="' + d + '"/>';
    if (b.mission) {
      const [mx, my] = pt(a + span / 2);
      out += '<g transform="translate(' + (mx - 13).toFixed(1) + ' ' + (my - 13).toFixed(1) + ')"><circle cx="13" cy="13" r="13" fill="var(--surface)"/><circle cx="13" cy="13" r="11.5" fill="none" stroke="' + (i < done ? 'var(--act)' : 'var(--surface-3)') + '" stroke-width="1.5"/>' +
        '<svg x="6" y="6" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + IC.flag + '</svg></g>';
    }
    a += span;
  });
  return '<svg class="ring' + (opts.draw ? ' draw' : '') + '" id="ring" viewBox="0 0 200 200" role="button" tabindex="0" aria-label="' + esc(L('Blöcke von heute zeigen', 'Show today’s blocks')) + '">' + out + '</svg>';
}

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');

  const sid = i < 0 ? h : h.slice(0, i), v = i < 0 ? '' : h.slice(i + 1);

}

/* ---------- Lücken-Tippen (Buchstaben-Animation) ---------- */
function editDist(a, b) {
  const m = a.length, n = b.length, d = [];
  for (let i = 0; i <= m; i++) { d[i] = [i]; }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function judge(typed, right, alts) {
  const t = (typed || '').trim().toLowerCase();
  if (!t) return 'idk';
  if (t === right || (alts || []).indexOf(t) >= 0) return 'ok';
  if (editDist(t, right) <= (right.length > 5 ? 2 : 1)) return 'typo';
  return 'wrong';
}
function wireGap(id, onEnter) {
  const inp = document.getElementById(id + '-in');
  const gap = document.getElementById(id);
  if (!inp || !gap) return;
  const lts = gap.querySelector('.lts');
  let prev = inp.value;
  inp.addEventListener('input', () => {
    clearTimeout(autoTimer);
    const val = inp.value;
    S.typed = val;
    if (val.startsWith(prev) && val.length === prev.length + 1) {
      const s = document.createElement('span'); s.className = 'lt'; s.innerHTML = val.slice(-1) === ' ' ? '&nbsp;' : esc(val.slice(-1)); lts.appendChild(s);
    } else {
      lts.innerHTML = val.split('').map(c => '<span class="lt" style="animation:none">' + (c === ' ' ? '&nbsp;' : esc(c)) + '</span>').join('');
    }
    prev = val;
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); onEnter(); } });
  gap.addEventListener('click', () => { clearTimeout(autoTimer); inp.focus(); });
}
function autoType(id, text, after) {
  const gap = document.getElementById(id), inp = document.getElementById(id + '-in');
  if (!gap) return;
  const lts = gap.querySelector('.lts');
  let i = 0;
  const step = () => {
    if (i >= text.length) { if (after) after(); return; }
    const c = text[i++];
    const s = document.createElement('span'); s.className = 'lt'; s.innerHTML = c === ' ' ? '&nbsp;' : esc(c); lts.appendChild(s);
    if (inp) inp.value = text.slice(0, i);
    S.typed = text.slice(0, i);
    autoTimer = setTimeout(step, S.motion === 'off' ? 0 : 110);
  };
  autoTimer = setTimeout(step, S.motion === 'off' ? 0 : 450);
}

function waveBars(n, played) {

  return s + '</div>';
}

function wireWordSearch(idp, practiceGo, emptyGo) {
  idp = idp || '';
  const inp = document.getElementById(idp + 'w-search');
  if (!inp) return;
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    let n = 0;
    document.querySelectorAll('#' + idp + 'w-rows .row').forEach(r => { const hit = !q || r.textContent.toLowerCase().indexOf(q) >= 0; r.style.display = hit ? '' : 'none'; if (hit) n++; });
    const f = document.getElementById(idp + 'w-found');
    if (!f) return;
    if (!q) { f.innerHTML = ''; return; }
    f.innerHTML = n
      ? '<button class="btn sec full" id="' + idp + 'w-these" data-go="' + practiceGo + '">' + L('Diese ' + n + ' üben', 'Practice these ' + n) + '</button>'
      : '<div class="tw-empty"><b>' + L('„' + esc(inp.value.trim()) + '“ ist noch nicht in deinen Wörtern.', '“' + esc(inp.value.trim()) + '” isn’t in your words yet.') + '</b><button class="btn sec full" id="' + idp + 'w-dict" data-go="' + emptyGo + '">' + ic('search', 'sm') + L('Im Wörterbuch suchen', 'Look it up') + '</button></div>';
  });
}

function tsMiniRing() {
  const segs = dayBlocks('normal'), T = segs.reduce((a, b) => a + b.m, 0), r = 15, C = 2 * Math.PI * r, gap = 2.2;
  let off = 0;
  return '<svg viewBox="0 0 40 40" class="ts-ring" aria-hidden="true">' + segs.map((b, i) => {
    const len = b.m / T * C - gap;
    const s = '<circle cx="20" cy="20" r="' + r + '" fill="none" stroke="' + (i < 3 ? 'var(--act)' : 'var(--surface-3)') + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 20 20)"/>';
    off += b.m / T * C;
    return s;
  }).join('') + '</svg>';
}

/* Lingo Vorschau · Laptop-Bildschirme L1–L10.

const DESK = {};
DESK.bp = function (w) {
  if (w < 1024) return { cls: 'bp-narrow rail', fs: 16 };
  if (w < 1280) return { cls: 'bp-mid rail', fs: 16 };
  if (w < 1920) return { cls: '', fs: 16 };
  if (w < 2400) return { cls: 'bp-xl', fs: 18 };
  return { cls: 'bp-xl', fs: 20 };
};
DESK.frame = function (def, v, W, H) {
  if (def.full) return def.render(v, { W, H });
  if (W >= 1024) {
    return '<div class="view">' + DESK.shell(def, v, W, H, '') + '</div>';
  }
  const s = (W - 32) / 1440;
  return '<div class="view scrollx"><div class="landhint">' + ic('rotate', 'sm') + '<span>' + L('Laptop-Ansicht, verkleinert auf 1440 × 900. Für mehr Platz das Handy quer halten.', 'Laptop view, scaled from 1440 × 900. Turn the phone sideways for more room.') + '</span></div>' +
    '<div style="width:' + Math.floor(1440 * s) + 'px;height:' + Math.floor(900 * s) + 'px;margin:0 16px 24px;overflow:hidden" class="probeframe">' +
    '<div style="width:1440px;height:900px;transform:scale(' + s.toFixed(4) + ');transform-origin:top left">' + DESK.shell(def, v, 1440, 900, '') + '</div></div></div>';
};
DESK.shell = function (def, v, w, h, idp) {
  const bp = DESK.bp(w);
  const rail = S.ui.rail != null ? S.ui.rail : bp.cls.indexOf('rail') >= 0;
  const cls = bp.cls.replace('rail', '').trim() + (rail ? ' rail' : '');
  const out = def.render(v, { w, h, idp: idp || '' });
  return '<div class="desk ' + cls + '" id="' + (idp || '') + 'desk" style="width:' + w + 'px;height:' + h + 'px;font-size:' + bp.fs + 'px">' +
    DESK.side(def.nav, idp || '', rail) +
    '<div class="dmain"><div class="stage">' + out.stage + '</div>' + (out.ctx ? '<aside class="ctx" aria-label="' + esc(L('Kontext', 'Context')) + '">' + out.ctx + '</aside>' : '') + '</div>' +
    (out.over || '') + '</div>';
};
DESK.side = function (active, idp, rail) {
  const t4 = S.tab4 === 'praxis' ? L('Praxis', 'Practice') : L('Sprechen', 'Speaking');
  const n = (id, icon, label, go, sub) => '<button class="nav' + (sub ? ' sub' : '') + (active === id ? ' on' : '') + '" id="' + idp + 'nav-' + id + '"' + (go ? ' data-go="' + go + '"' : ' data-act="noop"') + (rail ? ' aria-label="' + esc(label) + '" title="' + esc(label) + '"' : '') + (active === id ? ' aria-current="page"' : '') + '>' + (sub ? '' : ic(icon)) + '<span class="lbl2">' + label + '</span></button>';
  const subs = S.tab4 === 'praxis' && !rail ? n('sprechen', '', L('Sprechen', 'Speaking'), 'l6-talk', true) + n('hoeren', '', L('Hören', 'Listening'), '', true) + n('lesen', '', L('Lesen', 'Reading'), '', true) : '';
  return '<nav class="side" aria-label="' + esc(L('Hauptbereiche', 'Main sections')) + '">' +
    '<div class="wm"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="var(--act)"/><path d="M8 7v10h8" fill="none" stroke="var(--act-fg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Lingo</b></div>' +
    n('heute', 'today', L('Heute', 'Today'), 'l1') + n('woerter', 'words', L('Wörter', 'Words'), 'l5') + n('grammatik', 'gram', L('Grammatik', 'Grammar'), 'l4') +
    n('praxis', S.tab4 === 'praxis' ? 'praxis' : 'speak', t4, 'l6-talk') + subs + n('fortschritt', 'prog', L('Fortschritt', 'Progress'), 'l8') +
    '<div class="sp"></div>' +

    '<button class="nav" id="' + idp + 'nav-rail" data-act="rail" aria-label="' + esc(rail ? L('Seitenleiste ausklappen', 'Expand sidebar') : L('Seitenleiste einklappen', 'Collapse sidebar')) + '">' + ic('sidebar') + '<span class="lbl2">' + L('Einklappen', 'Collapse') + '</span></button></nav>';

ACTS.rail = () => { const d = $('.desk'); const isRail = d && d.classList.contains('rail'); S.ui.rail = !isRail; render(); };

function dTop(blocks, cur, frac, o) {

  const blocks = dayBlocks(v === 'writing' || v === 'review' ? v : 'normal');

  const ring = ringSvg(blocks, done, partial, {}).replace('id="ring"', 'id="' + idp + 'ring"').replace('class="ring', 'style="width:13em;height:13em" class="ring');
  const center = v === 'done' ? '<div class="ringc"><span style="color:var(--act-text)">' + ic('check') + '</span><b class="disp num" style="font-size:2.1em;line-height:1.2">' + total + ' Min.</b></div>'
    : '<div class="ringc"><b class="disp num" style="font-size:3em;line-height:1">' + rem + '</b><span style="font-size:.85em">' + L('Min. übrig', 'min left') + '</span></div>';

    writing: ['s', L('Als Nächstes: Wochen-Mail · <em>Rückmeldung zu deinem Entwurf</em>', 'Next: weekly email · <em>feedback on your draft</em>')],
    review: ['s', L('Zum Schluss: dein Wochenbericht und die Wochenfrage', 'Last step: your weekly report and the week question')]
  }[v];
  return '<div class="dscroll"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2em"><h1 class="dh1 disp" style="margin:0">' + L('Heute', 'Today') + '</h1>' +
    '<button class="btn sec" id="' + idp + 'd-ask" data-go="l7" style="min-height:2.6em;font-size:.95em">' + ic('ask', 'sm') + L('Fragen', 'Ask') + '</button></div>' +
    '<div class="daycard" style="flex-direction:row;align-items:center;gap:2.2em;padding:2em 2.2em">' +

    weekStrip(v === 'done', v === 'review' ? 5 : 3).replace('<div class="gx"><div class="week"', '<div><div class="week" style="padding:1.6em .2em .4em;max-width:30em"') + '</div>';
}

/* ---------- L2 Wörter-Übung ---------- */
function l2Stage(v) {

  const shown = checked ? (st === 'idk' ? WORD.right : (S.typed && S.ui.ownInput ? S.typed : WORD.you[st])) : (S.typed || '');
  const you = Object.assign({}, WORD.you, S.typed && S.ui.ownInput ? { [st]: esc(S.typed) } : {});
  let s = dTop(blocks, 1, checked ? 0.6 : 0.45) + '<div class="dscroll" style="display:flex;flex-direction:column;padding-top:1em">' +
    blockLine('w', L('Wörter · ', 'Words · ') + TOPIC()) + instr(L('Wie heißt das auf Englisch?', 'What is this in English?'), 'd-why') +
    '<div class="stack s16" style="padding:3.5em 0 2em;align-items:flex-start"><div class="prompt disp">' + L('die Lieferzeit', 'die Lieferzeit') + '</div><div class="hintline" id="d-hint">' + L('im Einkauf · 2 Wörter', 'in purchasing · 2 words') + '</div>' +
    '<div style="padding-top:.5em">' + gapHtml(shown, { big: true, caret: !checked, input: !checked, st: checked ? ({ ok: 'ok', typo: 'near', wrong: 'bad', idk: 'idk' }[st]) : '' }) + '</div></div>';
  if (checked) {
    s += '<div class="dverdict ' + stCls(st) + '" id="d-verdict" role="status">' + verdictRow(st) + cmpLine(st, you[st], WORD.right) + '<p class="whyl" style="margin:.2em 0 0">' + WD.why[st] + '</p>' +
      '<div class="bandbtns" style="padding-top:.5em;max-width:28em"><button class="btn sec sm" id="d-more" data-act="noop">' + L('Mehr', 'More') + '</button>' + (st === 'wrong' || st === 'typo' ? '<button class="btn sec sm" id="d-also" data-go="l7">' + L('War das auch richtig?', 'Was mine also right?') + '</button>' : '') + '</div></div>';
  }
  s += '</div>';
  s += dKeys(checked ? '<button class="btn pri" id="d-next" data-go="l3">' + L('Weiter', 'Continue') + kb('⏎') + '</button>'
    : '<button class="btn sec" id="d-tip" data-act="tip">' + L('Tipp', 'Hint') + kb('T') + '</button><button class="btn sec" id="d-idk" data-act="idk">' + L('Weiß ich nicht', 'Don’t know') + kb('W') + '</button><button class="btn pri" id="d-check" data-act="check">' + L('Prüfen', 'Check') + kb('⏎') + '</button>');
  return s;
