<title>Lingo-Engine Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Tokens aus der App (src/styles/index.css): Dunkel ist Standard, Hell als Alternative. */
:root {
  color-scheme: dark;
  --bg: #0b0f19;
  --surface: rgba(255,255,255,0.045);
  --surface-strong: rgba(255,255,255,0.08);
  --solid: #121827;
  --line: rgba(255,255,255,0.09);
  --fg: #e9edf5;
  --muted: #a3acbd;
  --subtle: #8a93a6;
  --accent: #10b981;
  --accent-fg: #03140d;
  --accent-text: #34d399;
  --accent-soft: rgba(16,185,129,0.14);
  --gold: #fbbf24;
  --gold-soft: rgba(251,191,36,0.14);
  --danger: #f87171;
  --danger-soft: rgba(248,113,113,0.14);
  --cyan: #67e8f9;
  --cards: #a78bfa;
  --read: #38bdf8;
  --speak: #fb7185;
  --write: #fb923c;
  --scrim: rgba(3,6,12,0.62);
  --radius: 18px;
  --radius-s: 12px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f6f7f9; --surface: rgba(15,23,42,0.035); --surface-strong: rgba(15,23,42,0.07); --solid: #ffffff;
    --line: rgba(15,23,42,0.1); --fg: #0f172a; --muted: #475569; --subtle: #64748b;
    --accent: #059669; --accent-fg: #ffffff; --accent-text: #047857; --accent-soft: rgba(5,150,105,0.1);
    --gold: #b45309; --gold-soft: rgba(217,119,6,0.12); --danger: #b91c1c; --danger-soft: rgba(220,38,38,0.1);
    --cyan: #0e7490; --cards: #7c3aed; --read: #0369a1; --speak: #be123c; --write: #c2410c; --scrim: rgba(15,23,42,0.35);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7f9; --surface: rgba(15,23,42,0.035); --surface-strong: rgba(15,23,42,0.07); --solid: #ffffff;
  --line: rgba(15,23,42,0.1); --fg: #0f172a; --muted: #475569; --subtle: #64748b;
  --accent: #059669; --accent-fg: #ffffff; --accent-text: #047857; --accent-soft: rgba(5,150,105,0.1);
  --gold: #b45309; --gold-soft: rgba(217,119,6,0.12); --danger: #b91c1c; --danger-soft: rgba(220,38,38,0.1);
  --cyan: #0e7490; --cards: #7c3aed; --read: #0369a1; --speak: #be123c; --write: #c2410c; --scrim: rgba(15,23,42,0.35);
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 10px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.proto-note { font-size: 12px; color: var(--subtle); text-align: center; padding: 8px 16px 0; }
.screen { flex: 1; padding-inline: 16px; padding-block: 12px 110px; display: flex; flex-direction: column; gap: 18px; }
.screen.full { padding-bottom: 32px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.top h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.icons { display: flex; gap: 4px; }
.ib { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.ib:hover { background: var(--surface); color: var(--fg); }
.ib svg { width: 22px; height: 22px; }
.avatar { display: flex; align-items: center; gap: 8px; }
.avatar b { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-strong); display: grid; place-items: center; font-size: 14px; }
.avatar span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 14px; margin: -12px 0 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle); margin: 0; }
.card { background: var(--solid); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.hero h2 { margin: 0; font-size: 21px; letter-spacing: -0.01em; text-wrap: balance; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; font-size: 15px; }
.steps .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--subtle); transform: translateY(1px); }
.steps .done .dot { background: var(--accent); border-color: var(--accent); }
.steps .now .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.steps .min { color: var(--subtle); font-size: 13px; font-variant-numeric: tabular-nums; }
.steps .done span:nth-child(2) { color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-fg); width: 100%; font-size: 17px; }
.btn.soft { background: var(--surface-strong); }
.btn.ghost { color: var(--accent-text); padding: 0 8px; min-height: 40px; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.list .row:first-child { border-top: 0; }
.row.card { display: flex; flex-direction: row; align-items: center; text-align: left; border-top: 1px solid var(--line); }
.row .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.row .ic svg { width: 20px; height: 20px; }
.row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .t b { font-weight: 600; }
.row .t small { color: var(--muted); font-size: 13.5px; }
.row .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
.chev { color: var(--subtle); }
.quiet { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.resume { background: var(--gold-soft); color: var(--fg); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; text-align: left; width: 100%; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); z-index: 20; }
.tabbar nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 8px; font-size: 11.5px; color: var(--subtle); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent-text); }

/* Übungs-Player */
.bar { display: grid; grid-template-columns: 40px 1fr auto auto; align-items: center; gap: 8px; min-height: 44px; }
.prog { height: 6px; background: var(--surface-strong); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 200ms ease-out; }
.bar .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.block { font-size: 13px; color: var(--subtle); margin-top: -10px; }
.task { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-strong); }
.pips i.on { background: var(--cards); }
.sentence { font-size: 22px; line-height: 1.55; margin: 0; }
.w { border-radius: 6px; padding: 0 1px; cursor: pointer; }
.w:hover { background: var(--surface-strong); }
.w.saved { color: var(--accent-text); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.w.new { text-decoration: underline dotted var(--subtle); text-underline-offset: 5px; }
.gap { display: inline-block; min-width: 150px; border-bottom: 2px solid var(--accent); padding: 0 6px; color: var(--accent-text); font-weight: 600; }
.gap input { width: 150px; background: transparent; border: 0; color: inherit; font: inherit; font-weight: 600; outline: none; }
.hint { font-size: 14px; color: var(--muted); }
.feedback { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.feedback.ok { background: var(--accent-soft); }
.feedback.warn { background: var(--gold-soft); }
.feedback.bad { background: var(--danger-soft); }
.feedback b { font-size: 16px; }
.ex { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.stick { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

/* Anki-Karte */
.flash { min-height: 290px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 24px 18px; }
.flash .front { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.flash .ctx { font-size: 16px; color: var(--muted); max-width: 34ch; }
.flash .back { border-top: 1px solid var(--line); padding-top: 14px; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.flash .back strong { font-size: 20px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { border-radius: 14px; padding: 10px 4px; background: var(--surface-strong); display: flex; flex-direction: column; gap: 2px; align-items: center; font-weight: 600; font-size: 14.5px; border: 2px solid transparent; }
.grades button small { font-weight: 500; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grades button.again { color: var(--danger); }
.grades button.suggest { border-color: var(--accent); }
.suggest-note { font-size: 12.5px; color: var(--subtle); text-align: center; }
.mode { display: inline-flex; background: var(--surface-strong); border-radius: 11px; padding: 3px; }
.mode button { padding: 6px 12px; border-radius: 9px; font-size: 13px; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--solid); color: var(--fg); font-weight: 600; }

/* Blatt */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--solid); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 86vh; overflow: auto; display: flex; flex-direction: column; gap: 14px; animation: up 200ms ease-out; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-strong); align-self: center; }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.seg { display: grid; grid-auto-flow: column; background: var(--surface-strong); border-radius: 12px; padding: 3px; }
.seg button { padding: 8px; border-radius: 10px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 600; }
textarea, .field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--fg); font: inherit; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 99px; background: var(--surface-strong); font-size: 14px; }
.plus { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-text); font-size: 13px; font-weight: 600; }
.plus.done { background: transparent; color: var(--muted); }
.pop { position: fixed; z-index: 50; left: 16px; right: 16px; max-width: 448px; margin: 0 auto; bottom: 110px; background: var(--solid); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 8px; }
.pop header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 15px; }
.kv span:nth-child(even) { font-variant-numeric: tabular-nums; color: var(--muted); }
.cando { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.cando li { display: flex; gap: 10px; }
.cando i { font-style: normal; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; height: fit-content; white-space: nowrap; }
.cando .yes i { background: var(--accent-soft); color: var(--accent-text); }
.cando .part i { background: var(--gold-soft); color: var(--gold); }
.reading p { font-size: 18px; line-height: 1.7; margin: 0; }
.meta { font-size: 13px; color: var(--subtle); }
.compare { display: grid; gap: 10px; }
.compare div { border-radius: 12px; padding: 12px; background: var(--surface); font-size: 15px; }
.compare small { display: block; color: var(--subtle); font-size: 12px; margin-bottom: 4px; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .prog i { transition: none; } }
</style>

<div class="app">
  <p class="proto-note">Prototyp zum Durchklicken · Beispieldaten · nichts wird gespeichert</p>
  <div id="view"></div>
</div>
<div class="tabbar" id="tabbar"><nav>
  <button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</button>
  <button data-tab="wortschatz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>Wortschatz</button>
  <button data-tab="lesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H11v17H5.5A2.5 2.5 0 0 0 3 22.5zM21 5.5A2.5 2.5 0 0 0 18.5 3H13v17h5.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg>Lesen</button>
  <button data-tab="sprechen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>Sprechen</button>
</nav></div>
<div id="layer"></div>

<script>
const I = {
  claude: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
  tr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 6 6 8M11 5c-.5 3-3 6.5-7 8M13 21l4-9 4 9M14.5 18h5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg>',
  brief: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  head: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/></svg>',
};
const S = { tab: 'heute', day: 'open', blocks: 0, saved: new Set(['leverage']), sessionStep: 0, ankiShown: false, ankiIdx: 0, ankiMode: 'flip', sheet: null, claudeTab: 'tr', speakSeg: 'talk' };
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

function topbar(title) {
  return `<div class="top">
    <button class="avatar" data-act="profile" aria-label="Profil und Stand"><b>E</b><span>Serie 12</span></button>
    <div class="icons">
      <button class="ib" data-act="claude-tr" aria-label="Übersetzen">${I.tr}</button>
      <button class="ib" data-act="claude-ask" aria-label="Claude fragen">${I.claude}</button>
    </div></div>
    <div class="top"><h1>${title}</h1></div>`;
}

const DAY_BLOCKS = [
  ['Wiederholen', '18 Karten · Anki', '6 Min.'],
  ['Input', 'Kurzer Text: „Why CFOs push back on SaaS“', '5 Min.'],
  ['Aufgabe', 'Sag es: Antworte dem CFO in 4–6 Sätzen', '9 Min.'],
  ['Fokus', 'Deutsch-Falle „since + Gegenwart“', '4 Min.'],
  ['Nochmal, aber besser', 'Deine 2 Sätze von gestern', '3 Min.'],
];

function heute() {
  const done = S.day === 'done';
  const steps = DAY_BLOCKS.map(([t, d, m], i) => {
    const cls = done || i < S.blocks ? 'done' : i === S.blocks ? 'now' : '';
    return `<li class="${cls}"><span class="dot"></span><span><b style="font-weight:600">${t}</b><br><small style="color:var(--muted)">${d}</small></span><span class="min">${m}</span></li>`;
  }).join('');
  return `${topbar('Heute')}
  <p class="sub">${new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })} · Wochenthema: <b style="color:var(--fg)">Einwände vom CFO</b></p>
  ${done ? `
  <section class="card hero">
    <p class="eyebrow" style="color:var(--accent-text)">✓ Fertig für heute</p>
    <h2>27 Min. · 5 von 5 Blöcken · 31 Antworten, 87 % richtig</h2>
    <p class="quiet">Serie jetzt 13 Tage. Morgen: Rollenspiel mit dem CFO.</p>
  </section>
  <p class="eyebrow">Lohnt sich jetzt</p>
  <button class="row card" style="padding:14px" data-act="open-reader"><span class="ic" style="background:var(--surface-strong);color:var(--read)">${I.book}</span><span class="t"><b>Why CFOs hate SaaS pricing</b><small>Lesen · 4 Min. · 7 neue Wörter</small></span><span class="chev">${I.chev}</span></button>
  <button class="btn ghost" data-act="reset-day" style="align-self:flex-start">↺ Prototyp: Tag zurücksetzen</button>
  ` : `
  <section class="card hero">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><p class="eyebrow">Deine Tageseinheit</p><span class="meta">${S.blocks} von 5 · ca. 27 Min.</span></div>
    <h2>Einwände vom CFO entkräften</h2>
    <ol class="steps">${steps}</ol>
    <button class="btn primary" data-act="start-day">${S.blocks ? 'Weiter →' : 'Starten →'}</button>
  </section>
  ${S.blocks ? '' : `<button class="resume" data-act="open-anki"><span>↻ Weiter, wo du warst: Stapel „Beruf“, Karte 23 von 40</span><span class="chev">${I.chev}</span></button>`}
  <p class="quiet">Preply morgen 18:00 · die Einheit morgen bereitet dich darauf vor.</p>
  `}
  <p class="eyebrow">Dein Weg</p>
  <div class="card list" style="padding:4px 14px">
    <button class="row"><span class="t"><b>Woche 7 von 24 · Verhandeln</b><small>Nächste Woche: Präsentieren vor dem Vorstand</small></span><span class="chev">${I.chev}</span></button>

function readingText() {
  const txt = 'Most finance leaders do not object to the price itself. They object to the unpredictability of it. A vendor who can lock in costs for three years and phase out legacy fees will win the budget discussion.';

  return '<p>' + txt.split(' ').map((w) => {
    const bare = w.replace(/[.,]/g, '');

    const cls = S.saved.has(key) ? 'w saved' : unknown.has(key) ? 'w new' : 'w';

function toast(t) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t; el.setAttribute('role', 'status');
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}

function popover(word) {
  const key = word.toLowerCase();
  const info = { unpredictability: ['Unberechenbarkeit', '/ˌʌn.prɪˌdɪk.təˈbɪl.ə.t̬i/'], lock: ['festschreiben (lock in)', '/lɑːk ɪn/'], phase: ['auslaufen lassen (phase out)', '/feɪz aʊt/'], legacy: ['Alt-, veraltet', '/ˈleɡ.ə.si/'], object: ['Einwände haben (object to)', '/əbˈdʒekt/'] }[key] || ['Bedeutung im Satz', ''];
  document.querySelector('.pop')?.remove();
  const el = document.createElement('div');
  el.className = 'pop'; el.setAttribute('role', 'dialog');
  const has = S.saved.has(key);
  el.innerHTML = `<header><b style="font-size:18px">${esc(word)}</b><span class="meta">${info[1]} ▶</span></header><span>${info[0]}</span><div style="display:flex;gap:8px;align-items:center"><button class="plus ${has ? 'done' : ''}" data-act="add" data-word="${esc(key)}">${has ? '✓ im Wortschatz' : '+ Wortschatz'}</button><button class="btn ghost" data-act="close-pop">Schließen</button></div>`;
  document.body.appendChild(el);
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tabbar button');
  if (tab) { S.tab = tab.dataset.tab; S.sheet = null; render(); return; }
  const w = e.target.closest('.w');
  if (w && !e.target.closest('[data-act]')) { popover(w.dataset.word); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'close-sheet' && e.target.closest('[data-stop]')) return;
  switch (act) {
    case 'start-day': S.tab = 'player'; S.sessionStep = Math.min(S.blocks === 0 ? 0 : S.sessionStep, 6); render(); break;
    case 'leave': S.tab = 'heute'; S.blocks = S.sessionStep < 2 ? 0 : S.sessionStep < 4 ? 1 : S.sessionStep < 5 ? 2 : S.sessionStep < 6 ? 3 : 4; render(); toast('Gespeichert · „Weiter“ setzt genau hier fort'); break;
    case 'next': S.sessionStep++; S.ankiShown = false; S.gapTries = 0; render(); break;
    case 'check-gap': {
      const val = ($('#gap1').value || '').trim().toLowerCase();
      const ok = val === 'phase out';
      S.gapTries = (S.gapTries || 0) + 1;
      const ex = `<ul class="ex"><li>The vendor will phase out support next year.</li><li>We are phasing out paper invoices.</li></ul>`;
      if (ok) $('#fb').innerHTML = `<div class="feedback ok"><b>Richtig · phase out</b><span>${S.gapTries === 1 ? 'Gut · wieder in 4 Tagen' : 'Mit Hinweis · wieder morgen'}</span>${ex}</div>`;
      else if (S.gapTries === 1) $('#fb').innerHTML = `<div class="feedback warn"><b>Noch nicht. Hinweis: beginnt mit „ph…“ (2 Wörter)</b><span>Versuch es noch einmal. Die Lösung kommt nach dem zweiten Versuch.</span></div>`;
      else $('#fb').innerHTML = `<div class="feedback warn"><b>Lösung: phase out</b><span>Du hattest: „${esc(val || '–')}“ · Nochmal · kommt heute noch einmal</span>${ex}</div>`;
      const done = ok || S.gapTries >= 2;
      a.textContent = done ? 'Weiter' : 'Prüfen'; a.dataset.act = done ? 'next' : 'check-gap';
      break;
    }
    case 'check-say':
      $('#fb').innerHTML = `<div class="feedback warn"><b>Gut verständlich. 2 Dinge machen es C1:</b>
        <span>1. „Since two years we help“ → Hinweis: Zeitraum bis jetzt. <em>Tippe unten auf „Lösung“</em></span>
        <span>2. „make a pilot“ → natürlicher: <b>run a pilot</b></span>
        <span style="color:var(--muted)">C1-Aufwertung: „How about a three-month pilot so you can see the savings for yourself?“</span></div>`;
      a.textContent = 'Weiter'; a.dataset.act = 'next'; break;
    case 'check-fix': {
      const val = ($('#fix').value || '').toLowerCase();
      const ok = /for two years/.test(val) && /(have been helping|have helped)/.test(val);
      $('#fb').innerHTML = ok ? `<div class="feedback ok"><b>Richtig</b><span>„for two years“ + Present Perfect: seit einem Zeitraum bis heute.</span></div>` : `<div class="feedback warn"><b>Hinweis: Zeitraum bis jetzt → Present Perfect, und „since“ nur mit Zeitpunkt.</b><span>Lösung: For two years (now), we have been helping companies …</span></div>`;
      a.textContent = 'Weiter'; a.dataset.act = 'next'; break;
    }
    case 'finish-day': S.day = 'done'; S.blocks = 5; S.tab = 'heute'; render(); toast('Einheit abgeschlossen · Serie 13'); break;
    case 'reset-day': S.day = 'open'; S.blocks = 0; S.sessionStep = 0; render(); break;
    case 'flip': S.ankiShown = true; render(); break;
    case 'grade': S.ankiShown = false; if (S.tab === 'player') { S.sessionStep++; } else { S.ankiIdx++; } toast(a.firstChild.textContent.trim() + ' · gespeichert'); render(); break;
    case 'open-anki': S.tab = 'anki'; S.ankiShown = false; S.ankiIdx = 0; render(); break;
    case 'back-vocab': S.tab = 'wortschatz'; render(); break;
    case 'mode-flip': S.ankiMode = 'flip'; render(); break;
    case 'mode-type': S.ankiMode = 'type'; render(); break;
    case 'open-reader': S.tab = 'reader'; render(); break;
    case 'back-lesen': S.tab = 'lesen'; render(); break;
    case 'seg-talk': S.speakSeg = 'talk'; render(); break;
    case 'seg-write': S.speakSeg = 'write'; render(); break;
    case 'seg-preply': S.speakSeg = 'preply'; render(); break;
    case 'claude-tr': S.sheet = 'claude'; S.claudeTab = 'tr'; render(); break;
    case 'claude-ask': S.sheet = 'claude'; S.claudeTab = 'ask'; render(); break;
    case 'ctab-tr': S.claudeTab = 'tr'; render(); break;
    case 'ctab-ask': S.claudeTab = 'ask'; render(); break;
    case 'profile': S.sheet = 'profile'; render(); break;
    case 'close-sheet': S.sheet = null; render(); break;
    case 'close-pop': document.querySelector('.pop')?.remove(); break;
    case 'word': popover(a.dataset.word); break;
    case 'add': {
      const k = a.dataset.word;
      if (!S.saved.has(k)) { S.saved.add(k); toast(`„${k}“ im Wortschatz · mit Satz gespeichert`); }
      document.querySelector('.pop')?.remove();
      const keep = S.sheet; render(); S.sheet = keep;
      break;
    }
  }
});
render();
</script>
